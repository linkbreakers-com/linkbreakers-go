name: Update and Publish SDK

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'

      - name: Install OpenAPI Generator
        run: npm install -g @openapitools/openapi-generator-cli

      - name: Check whether the version is already tagged
        id: compare
        run: |
          NEW_VERSION=$(curl -fsS https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json | jq -r '.info.version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "v$NEW_VERSION is already tagged"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "Publishing v$NEW_VERSION"
          fi

      - name: Generate SDK
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          curl -fsS https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json \
            | jq '.openapi = "3.1.0" | del(.jsonSchemaDialect)' > openapi-3.1.json

          find . -maxdepth 1 -type f -name "*.go" -delete
          rm -f go.mod go.sum
          openapi-generator-cli generate \
            -i openapi-3.1.json \
            -g go \
            -o . \
            -c openapi-config.yaml \
            -t templates \
            --skip-validate-spec \
            --git-host github.com \
            --git-user-id linkbreakers-com \
            --git-repo-id linkbreakers-go \
            --global-property apiTests=false,modelTests=false,apiDocs=false,modelDocs=false

          echo "$NEW_VERSION" > OPENAPI_VERSION
          rm openapi-3.1.json
          go mod tidy

      - name: Smoke check the module and README
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          go build ./...
          ./scripts/check-docs.sh

      - name: Commit, tag and publish
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SDK to API version $NEW_VERSION"
          fi
          git tag "v$NEW_VERSION"
          git push --atomic origin main "v$NEW_VERSION"
          curl -fsS "https://proxy.golang.org/github.com/linkbreakers-com/linkbreakers-go/@v/v$NEW_VERSION.info"

      - name: Close release failure issues
        if: success() && steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Published v$NEW_VERSION."
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.compare.outputs.new_version || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="Publishing linkbreakers-go v$NEW_VERSION failed. Run: $RUN_URL"
          echo "::error title=Release failed::$MESSAGE"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The update and publish workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "SDK release failing" --body "$MESSAGE"
          fi
