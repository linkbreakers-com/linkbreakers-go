    ListVisitorsRequest:
      description: "ListVisitorsRequest controls pagination, search, and export format\
        \ for visitor roster views."
      example:
        include:
        - devices
        - events
        - links
        search: search
        sortDirection: SORT_DIRECTION_DESC
        linkId: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
        sortField: VISITOR_SORT_FIELD_VISIT_COUNT
        pageSize: 0
        attributeFilters:
        - value: "800000"
          key: budget
          operator: VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_OR_EQUAL
        - value: "800000"
          key: budget
          operator: VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_OR_EQUAL
        responseFormat: RESPONSE_FORMAT_JSON
        pageToken: pageToken
        email: email
      properties:
        attributeFilters:
          description: |-
            Only return visitors matching every filter, for example budget >= 800000
            and timeline = "under_6_months". At most 20. Over REST, use
            POST /v1/visitors/search: a query string cannot carry them.
          items:
            $ref: "#/components/schemas/VisitorAttributeFilter"
          type: array
        email:
          title: optional exact match filter
          type: string
        include:
          example:
          - devices
          - events
          - links
          items:
            type: string
          type: array
        linkId:
          example: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          title: optional filter by link ID (UUID; visitors who have interacted with
            this link)
          type: string
        pageSize:
          format: int64
          title: "Maximum number of visitors to return (default 50, max 200)"
          type: integer
        pageToken:
          title: Cursor token to retrieve the next page of results
          type: string
        responseFormat:
          default: RESPONSE_FORMAT_JSON
          description: |-
            ResponseFormat defines the transport format the API should return for list-style endpoints.

             - RESPONSE_FORMAT_UNSPECIFIED: Response format not specified
             - RESPONSE_FORMAT_JSON: Response format JSON
             - RESPONSE_FORMAT_CSV: Response format CSV
          enum:
          - RESPONSE_FORMAT_UNSPECIFIED
          - RESPONSE_FORMAT_JSON
          - RESPONSE_FORMAT_CSV
          example: RESPONSE_FORMAT_JSON
          type: string
        search:
          title: optional fuzzy search across known fields
          type: string
        sortDirection:
          description: |-
            SortDirection is the ordering applied to any sortable list endpoint.
            Shared across resources so a caller learns it once.

             - SORT_DIRECTION_UNSPECIFIED: Sort direction not specified (defaults to descending)
             - SORT_DIRECTION_ASC: Sort in ascending order
             - SORT_DIRECTION_DESC: Sort in descending order
          enum:
          - SORT_DIRECTION_UNSPECIFIED
          - SORT_DIRECTION_ASC
          - SORT_DIRECTION_DESC
          example: SORT_DIRECTION_DESC
          type: string
        sortField:
          allOf:
          - $ref: "#/components/schemas/VisitorSortField"
          description: Field to sort by. Defaults to created_at (newest first).
          example: VISITOR_SORT_FIELD_VISIT_COUNT
