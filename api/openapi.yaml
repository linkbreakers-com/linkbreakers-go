openapi: 3.1.0
info:
  contact:
    name: Linkbreakers Support
    url: https://app.linkbreakers.com
  description: |-
    This is a documentation of all the APIs of Linkbreakers

    ## Entry points

    `GET https://api.linkbreakers.com/` and `GET https://api.linkbreakers.com/v1` answer without credentials with the API's name, version and links. This document is served at `https://api.linkbreakers.com/openapi.json`.

    ## Rate limits

    Every response describes where the caller stands in the IETF `RateLimit-Policy` and `RateLimit` header fields (draft-ietf-httpapi-ratelimit-headers), and in `RateLimit-Limit`, `RateLimit-Remaining`, `RateLimit-Reset` and `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` (a Unix timestamp) for clients that read those. A request past the limit gets `429 Too Many Requests` with `Retry-After` in seconds.

    - Workspace API token: 600 requests per 60 seconds, per token.
    - Dashboard session or OAuth token: 500 requests per 60 seconds, per token.
    - No credentials: 300 requests per 60 seconds, per client IP.

    Each plan also includes a number of API calls per billing cycle. Past it, calls answer `429` with the code `MAX_PUBLIC_API_QUERIED_REACHED` until the cycle renews or the plan changes.

    ## Pagination

    Every list pages with opaque cursors (AIP-158). Pass `pageSize`, then send the `nextPageToken` of each response back as `pageToken` (or its alias `cursor`) to get the next page. An empty or absent `nextPageToken` means the list is complete. Each list operation describes this in `x-pagination`.

    ## Batches and background jobs

    `POST /v1/links/bulk` creates up to 250 links in one transactional request; `POST /v1/links/batch` takes the same links as a bare JSON array. `POST /v1/links/bulk/jobs` accepts the same batch and answers `202 Accepted` at once with a job and a `Location` header; poll `GET /v1/jobs/{id}` until `status` is `JOB_STATUS_SUCCEEDED` (the created link ids are in `linksBulkCreate.linkIds`) or `JOB_STATUS_FAILED` (`error` says why, and nothing was created). Jobs can be read for 24 hours after they finish.

    ## Versioning and deprecation

    The version is in the path: every operation lives under `/v1`. Within a version, changes are additive only: new operations, new optional request fields, new response fields and new enum values. Clients should ignore fields and enum values they do not know. Anything that would break an existing client ships under a new path version instead.

    An operation is retired in two steps. First it is deprecated: it keeps working, is flagged `deprecated: true` in this document, and every response carries a `Deprecation` header field (RFC 9745) with the time it was deprecated and a `Link` with `rel="deprecation"` to the policy. Then, at least 180 days later, it may be removed; that date is announced in advance in a `Sunset` header field (RFC 8594) and as `x-sunset` on the operation. The full policy: https://linkbreakers.com/help/article/api-versioning-and-deprecation-policy

    ## Idempotent retries

    Every POST, PUT and PATCH accepts an optional `Idempotency-Key` header (draft-ietf-httpapi-idempotency-key-header). Send a new unique value, such as a UUID, with each logical request and reuse it only to retry that request. A retry with the same key and the same request returns the first response, marked `Idempotent-Replayed: true`, instead of running again. Keys are scoped to the token and kept for 24 hours. The same key with a different request is refused with `422`, and a retry while the first request is still running gets `409` with `Retry-After`. Server errors (5xx) and refusals such as 401, 403 and 429 are not stored, so retrying them runs the request again.
  title: Linkbreakers API
  version: 1.162.0
  x-api-versioning:
    compatibility: additive changes only within a version
    currentVersion: v1
    deprecationHeaders:
    - Deprecation
    - Sunset
    - Link
    minimumNoticeDays: 180
    policy: https://linkbreakers.com/help/article/api-versioning-and-deprecation-policy
    strategy: url-path
servers:
- url: https://api.linkbreakers.com
security:
- bearerAuth: []
tags:
- description: "Claiming a workspace an AI agent registered for itself. An agent registers\
    \ at the authorization server (https://mcp.linkbreakers.com/agent/identity, see\
    \ https://linkbreakers.com/auth.md) and hands a person a claim link and a 6-digit\
    \ code; these endpoints are the person's side of that ceremony."
  name: Agent Identity
- description: "What the workspace has used of each limit its plan sets, read from\
    \ the same counters that enforce them."
  name: Allowances
- description: "Endpoints for managing analytics dashboards with flexible, config-driven\
    \ widgets. Each widget defines its own data source and visualization."
  name: Analytics Dashboard
- description: "Endpoints for retrieving aggregated analytics data for dashboard widgets\
    \ including geographic breakdown, device distribution, and visitor trends."
  name: Analytics Data
- description: "The permissions an API token or OAuth grant can hold. Every authenticated\
    \ endpoint requires exactly one scope, declared on the operation."
  name: API Scopes
- description: Context-aware assistant that delegates to specialized sub-assistants
    based on the resource being edited.
  name: Assistant
- description: "Endpoints for managing custom domains in Linkbreakers. These endpoints\
    \ allow you to register, verify, and manage custom domains for your workspace."
  name: Custom Domains
- description: Endpoints for managing directories in Linkbreakers. Directories let
    you organize links and other directories into a hierarchical folder structure.
  name: Directories
- description: Endpoints for managing events in Linkbreakers. These endpoints allow
    you to collect data and list events.
  name: Events
- description: Connect your Google account to automatically sync form responses from
    links that redirect to Google Forms.
  name: Google Forms Integrations
- description: "Long-running operations. An endpoint that works in the background\
    \ answers 202 Accepted with a job and a Location header; poll GET /v1/jobs/{id}\
    \ until the status is JOB_STATUS_SUCCEEDED or JOB_STATUS_FAILED. Jobs can be read\
    \ for 24 hours after they finish."
  name: Jobs
- description: "Endpoints for managing shortened links in Linkbreakers. These endpoints\
    \ allow you to create, retrieve, list, and delete shortened links for your workspace."
  name: Links
- description: "Endpoints for managing media files in Linkbreakers. These endpoints\
    \ allow you to upload, retrieve, list, and delete media files for your workspace."
  name: Media
- description: "Endpoints for managing members in Linkbreakers. These endpoints allow\
    \ you to invite, retrieve, update, and delete members."
  name: Members
- description: "Endpoints for analyzing workspace activity within Linkbreakers, covering\
    \ rolling event totals, audience reach, and calendar heatmaps."
  name: Workspace Metrics
- description: "Endpoints for managing Page Theme Templates in Linkbreakers. These\
    \ endpoints allow you to create, retrieve, update, publish, import, and delete\
    \ reusable page styling."
  name: Page Theme Templates
- description: "Endpoints for managing page visual themes. These endpoints allow you\
    \ to create, read, and update themes for canvas, cover, badge, container, typography,\
    \ and interactive elements."
  name: Page Themes
- description: "Public pricing catalog: the plans, what each costs and what each allows.\
    \ Prices come from the billing provider and limits from the code that enforces\
    \ them."
  name: Pricing
- description: "Endpoints for managing QR Code Designs in Linkbreakers. These endpoints\
    \ allow you to create, retrieve, update, and delete QR Code Designs."
  name: QR Code Designs
- description: "Endpoints for managing QR Code Templates in Linkbreakers. These endpoints\
    \ allow you to create, retrieve, update, and delete QR Code Templates."
  name: QR Code Templates
- description: "Sandbox workspaces for testing an integration without touching live\
    \ data. A sandbox is a separate, API-only workspace created from your live workspace.\
    \ Its tokens start with `lb_test_`, and the API refuses a `lb_test_` prefix on\
    \ a live token. Sandbox usage is never billed and does not count toward your plan:\
    \ a sandbox has its own monthly caps (1,000 API calls, 500 counted scans and credits\
    \ for 50 links) and allows no custom domains, members or credit top-ups. Links\
    \ resolve and webhooks fire normally; a scan of a sandbox link answers with `X-Linkbreakers-Sandbox:\
    \ true` and `X-Robots-Tag: noindex`. A sandbox and everything in it is deleted\
    \ 30 days after it was created. A workspace holds at most 3 sandboxes."
  name: Sandboxes
- description: Endpoints for managing link-level data collection settings in Linkbreakers.
  name: Link Settings
- description: Endpoints for managing the Slack integration. Connect your Slack workspace
    to receive real-time notifications when events occur on your links.
  name: Slack Integrations
- description: Endpoints for managing tags in Linkbreakers. These endpoints allow
    you to search for tags in a workspace.
  name: Tags
- description: Endpoints for managing time series in Linkbreakers. These endpoints
    allow you to get events time series.
  name: Times Series
- description: "Identify and manage visitors. Accepts system fields like $email, $phone\
    \ and arbitrary key/value attributes."
  name: Visitors
- description: "Endpoints for managing webhooks in Linkbreakers. These endpoints allow\
    \ you to create, list, and delete webhooks for event notifications."
  name: Webhooks
- description: Not part of the public API.
  name: Internal
- description: "Endpoints for managing workflow steps in Linkbreakers. Workflow steps\
    \ define the behavior of links, such as redirection destinations and data collection\
    \ flows."
  name: Workflow Steps
- description: "Endpoints for managing workspace tokens in Linkbreakers. These endpoints\
    \ allow you to create, list, and delete workspace tokens for authentication."
  name: Workspace Tokens
- description: Endpoints for managing workspaces in Linkbreakers. These endpoints
    allow you to update and get workspaces.
  name: Workspaces
paths:
  /v1/agent-identity/claim/complete:
    post:
      description: "Check the code the agent handed over, attach the claim email with\
        \ a password or a Google or Microsoft sign-in to the agent's workspace, and\
        \ sign in. The email must not already have a Linkbreakers account. Afterwards\
        \ the agent's token keeps working in the claimed workspace, and the agent\
        \ can fetch a token with wider scopes from the claim grant."
      operationId: AgentIdentityService_ClaimAgentWorkspace
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimAgentWorkspaceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security: []
      summary: Claim an agent's workspace
      tags:
      - Agent Identity
  /v1/agent-identity/claim/lookup:
    post:
      description: "Return the email a claim link is bound to, whether it can still\
        \ be used, and what the agent may do once the workspace is claimed. The claim_attempt_token\
        \ is the secret: anyone holding it and the code can claim."
      operationId: AgentIdentityService_GetAgentClaim
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAgentClaimRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentClaim"
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security: []
      summary: Read an agent claim link
      tags:
      - Agent Identity
  /v1/allowances:
    get:
      description: |-
        Return every limit the workspace's plan sets with what has been used in the current cycle, when it resets and whether it has been reached.

        Requires the `workspace:read` scope.
      operationId: AllowancesService_ListAllowances
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAllowancesResponse"
          description: Everything worked as expected.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security:
      - bearerAuth:
        - workspace:read
      - oauth2:
        - workspace:read
      summary: List allowances
      tags:
      - Allowances
      x-required-scope: workspace:read
  /v1/allowances/dismiss:
    post:
      description: |-
        Hide the over-limit notice for one limit, for the calling member, until the limit's next cycle. Only a member can dismiss; an API token gets a permission error.

        Requires the `workspace:write` scope.
      operationId: AllowancesService_DismissAllowanceNotice
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissAllowanceNoticeRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                properties: {}
                type: object
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security:
      - bearerAuth:
        - workspace:write
      - oauth2:
        - workspace:write
      summary: Dismiss an allowance notice
      tags:
      - Allowances
      x-required-scope: workspace:write
  /v1/analytics/attributes/distribution:
    post:
      description: |-
        Returns how visitors are spread across the values of one attribute, for example how many gave each rating.

        Requires the `analytics:read` scope.
      operationId: AnalyticsDataService_GetAttributeDistribution
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAttributeDistributionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAttributeDistributionResponse"
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security:
      - bearerAuth:
        - analytics:read
      - oauth2:
        - analytics:read
      summary: Get visitor attribute distribution
      tags:
      - Analytics Data
      x-required-scope: analytics:read
  /v1/analytics/attributes/metric:
    post:
      description: |-
        Returns count, average, minimum and maximum for a visitor attribute, plus how much of the audience carries it.

        Requires the `analytics:read` scope.
      operationId: AnalyticsDataService_GetAttributeMetric
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAttributeMetricRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAttributeMetricResponse"
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security:
      - bearerAuth:
        - analytics:read
      - oauth2:
        - analytics:read
      summary: Get visitor attribute metric
      tags:
      - Analytics Data
      x-required-scope: analytics:read
  /v1/analytics/attributes/values:
    post:
      description: |-
        Returns the individual recorded values of one attribute, most recent first. Intended for free text such as comments.

        Requires the `analytics:read` scope.
      operationId: AnalyticsDataService_GetAttributeValues
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetAttributeValuesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAttributeValuesResponse"
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security:
      - bearerAuth:
        - analytics:read
      - oauth2:
        - analytics:read
      summary: List visitor attribute values
      tags:
      - Analytics Data
      x-required-scope: analytics:read
  /v1/analytics/breakdown:
    post:
      description: |-
        Returns a ranked breakdown of events by any dimension (browser, platform, device type, country, city, visit type).

        Requires the `analytics:read` scope.
      operationId: AnalyticsDataService_GetBreakdown
      parameters:
      - description: Makes retrying this request safe. See components.parameters.IdempotencyKey.
        explode: false
        in: header
        name: Idempotency-Key
        required: false
        schema:
          maxLength: 255
          minLength: 1
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GetBreakdownRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBreakdownResponse"
          description: Everything worked as expected.
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
      security:
      - bearerAuth:
        - analytics:read
      - oauth2:
        - analytics:read
      summary: Get dimension breakdown
      tags:
      - Analytics Data
      x-required-scope: analytics:read
  /v1/analytics/dashboards:
    get:
      description: Requires the `analytics:read` scope.
      operationId: AnalyticsDashboardService_ListDashboards
      parameters:
      - description: |-
          Restricts the result to the dashboard scoped to this link.
          Takes precedence over scope when both are set.
        explode: true
        in: query
        name: linkId
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Restricts the result by scope. Unset returns every dashboard.

           - DASHBOARD_SCOPE_UNSPECIFIED: Every dashboard in the workspace, link-scoped or not.
           - DASHBOARD_SCOPE_WORKSPACE: Only the workspace-wide dashboard, the one with no link.
           - DASHBOARD_SCOPE_LINK: Only dashboards tied to a link.
        explode: true
        in: query
        name: scope
        required: false
        schema:
          type: string
        style: form
      - description: "Maximum number to return. Defaults to 100, capped at 1000."
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: |-
          Cursor from a previous response's next_page_token. Empty starts at the
          first page. Pages are ordered by (created_at, id), which never change, so a
          record cannot move between pages while a client is walking them.
        explode: true
        in: query
        name: pageToken
        required: false
        schema:
          type: string
        style: form
      - description: "Opaque cursor from the previous page's nextPageToken. Same as\
          \ pageToken; when both are sent, pageToken wins."
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListDashboardsResponse"
          description: Everything worked as expected.
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
            RateLimit-Policy:
              $ref: "#/components/headers/RateLimit-Policy"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unexpected error
          headers:
            RateLimit:
              $ref: "#/components/headers/RateLimit"
