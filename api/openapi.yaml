      description: ResolveQrcodeImagesResponse carries the resolved URLs.
      example:
        qrcodeSignedUrls:
          key: qrcodeSignedUrls
      properties:
        qrcodeSignedUrls:
          additionalProperties:
            type: string
          description: |-
            Signed URL by link id. These expire, so treat them as good for this
            session and ask again rather than persisting them.
