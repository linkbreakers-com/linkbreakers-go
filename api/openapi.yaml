               - API_SCOPE_DOMAINS_READ: Read custom domains and their DNS instructions.
               - API_SCOPE_DOMAINS_WRITE: Add, verify, update and delete custom domains.
               - API_SCOPE_VISITORS_READ: Read and search visitors and their attributes.
