          additionalProperties:
            $ref: "#/components/schemas/PageThemeTemplateImages"
          description: Images by template id. These expire; fetch rather than store.
    ResolveQrcodeImagesRequest:
      description: ResolveQrcodeImagesRequest asks for signed QR code image URLs.
      example:
        linkIds:
        - linkIds
        - linkIds
      properties:
        linkIds:
          description: |-
            The links to resolve images for. Ids outside the caller's workspace, and
            links with no generated QR code yet, are simply absent from the response
            rather than failing the whole batch: a list draws the rows it can.
          items:
            type: string
          type: array
      required:
      - linkIds
