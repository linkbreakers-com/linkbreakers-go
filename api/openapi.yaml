          example: 987fcdeb-a321-45e6-b789-123456789012
          title: "Optional ID for the workflow step (UUID; if not provided, will be\
            \ generated by backend)"
          type: string
        insertBefore:
          description: |-
            Inserts the new step in front of this one: every branch that led to it
            now leads to the new step, and the new step's "next" branch leads on to
            it. Saves creating and then connecting each side by hand.
          type: string
        payload:
          allOf:
          - $ref: "#/components/schemas/WorkflowStepPayload"
          title: The payload for the workflow step (structure varies by event action)
      title: Request to create a new workflow step
    WorkflowStepsServiceResolveStepCollisionsBody:
      type: object
    WorkflowStepsServiceUpdateBody:
      example:
        payload: ""
        canvasPosition: ""
        attributeCapture: ""
      properties:
        attributeCapture:
          allOf:
          - $ref: "#/components/schemas/AttributeCapture"
          description: |-
            Replaces what the step saves to the visitor's profile (optional). Send
            the whole capture: setting enabled to false keeps the writes you send.
        canvasPosition:
          allOf:
          - $ref: "#/components/schemas/CanvasPosition"
          title: The updated canvas position (optional)
        payload:
          allOf:
          - $ref: "#/components/schemas/WorkflowStepPayload"
          title: The updated payload for the workflow step (optional)
      title: Request to update a workflow step
    Workspace:
      description: |-
        Serves as the tenant boundary in Linkbreakers, grouping links, members, settings, billing state,
        and analytics under a single organization's environment.
      example:
        country: country
        website: website
        publishedAt: 2000-01-23T04:56:07.000+00:00
        timezone: timezone
        verifiedAt: 2000-01-23T04:56:07.000+00:00
        description: description
        shortDescription: shortDescription
        tags: tags
        linkSettingId: fbb5c4b6-2a10-4f35-8cb1-60c613a92d2a
        createdAt: 2000-01-23T04:56:07.000+00:00
        enforceMfa: true
        enrollRequestedAt: 2000-01-23T04:56:07.000+00:00
        trialEndsAt: 2000-01-23T04:56:07.000+00:00
        inactiveSince: 2000-01-23T04:56:07.000+00:00
        subscriptionType: SUBSCRIPTION_TYPE_PRO_PLAN
        faq: faq
        name: name
        sandboxExpiresAt: 2000-01-23T04:56:07.000+00:00
        id: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
        digestFrequency: DIGEST_FREQUENCY_UNSPECIFIED
        isSandbox: true
        slug: slug
        updatedAt: 2000-01-23T04:56:07.000+00:00
      externalDocs:
        description: Learn more about workspaces in Linkbreakers.
        url: https://linkbreakers.com/help/article/what-is-a-workspace
      properties:
        country:
          title: ISO 3166-1 alpha-2 country code inferred from the owner signup or
            link activity
          type: string
        createdAt:
          format: date-time
          title: Timestamp when the workspace record was created
          type: string
        description:
          title: Optional description providing additional context about the workspace
          type: string
        digestFrequency:
          description: |-
            - DIGEST_FREQUENCY_UNSPECIFIED: Not specified; defaults to monthly
             - DIGEST_FREQUENCY_NONE: No digest emails
             - DIGEST_FREQUENCY_WEEKLY: Weekly digest every Monday
             - DIGEST_FREQUENCY_MONTHLY: Monthly digest on the 1st of each month
          enum:
          - DIGEST_FREQUENCY_UNSPECIFIED
          - DIGEST_FREQUENCY_NONE
          - DIGEST_FREQUENCY_WEEKLY
          - DIGEST_FREQUENCY_MONTHLY
          title: "How often the workspace receives traffic digest emails (none, weekly,\
            \ monthly)"
          type: string
        enforceMfa:
          title: Whether members must complete multi-factor authentication at sign
            in
          type: boolean
        enrollRequestedAt:
          format: date-time
          title: Timestamp when enrollment was requested for this workspace
          type: string
        faq:
          description: Frequently Asked Questions about this workspace stored as JSON
          title: FAQ data stored as JSON
          type: string
        id:
          example: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
          title: Unique identifier for the workspace (UUID)
          type: string
        inactiveSince:
          format: date-time
          title: When the workspace was flagged as inactive due to lack of activity
            (cleared on next sign-in/scan)
          type: string
        isSandbox:
          description: "True for a sandbox workspace: API-only, with its own caps,\
            \ never billed."
          readOnly: true
          type: boolean
        linkSettingId:
          example: fbb5c4b6-2a10-4f35-8cb1-60c613a92d2a
          title: Link setting configuration that governs visitor data collection (UUID)
          type: string
        name:
          title: Human-readable display name chosen during signup
          type: string
        publishedAt:
          format: date-time
          title: Timestamp when the workspace was published/made public
          type: string
        sandboxExpiresAt:
          description: When a sandbox workspace is deleted. Unset for a live workspace.
          format: date-time
          readOnly: true
          type: string
        shortDescription:
          title: Short description for the workspace
          type: string
        slug:
          title: Unique slug for the workspace (URL-friendly identifier)
          type: string
        subscriptionType:
          description: |-
            - SUBSCRIPTION_TYPE_UNSPECIFIED: Subscription plan not yet assigned
             - SUBSCRIPTION_TYPE_FREE_TRIAL: Workspace is currently in the free trial period
             - SUBSCRIPTION_TYPE_SPONSORED_PRO: Workspace is on the sponsored pro plan with full pro features
             - SUBSCRIPTION_TYPE_PRO_PLAN: Workspace has an active Pro plan subscription
             - SUBSCRIPTION_TYPE_ENTERPRISE_PLAN: Workspace is managed under an Enterprise contract
             - SUBSCRIPTION_TYPE_LIGHT_PLAN: Workspace has an active Light plan subscription
          enum:
          - SUBSCRIPTION_TYPE_UNSPECIFIED
          - SUBSCRIPTION_TYPE_FREE_TRIAL
          - SUBSCRIPTION_TYPE_SPONSORED_PRO
          - SUBSCRIPTION_TYPE_PRO_PLAN
          - SUBSCRIPTION_TYPE_ENTERPRISE_PLAN
          - SUBSCRIPTION_TYPE_LIGHT_PLAN
          example: SUBSCRIPTION_TYPE_PRO_PLAN
          title: Billing plan currently applied to the workspace
          type: string
        tags:
          title: Comma-separated tags for the workspace
          type: string
        timezone:
          title: Default timezone used to render analytics and schedules (IANA name)
          type: string
        trialEndsAt:
          format: date-time
          title: When the free trial period ends (null if not on trial)
          type: string
        updatedAt:
          format: date-time
          title: Timestamp of the last workspace-level update
          type: string
        verifiedAt:
          format: date-time
          title: "Timestamp when the workspace passed verification (e.g., owner email\
            \ confirmed)"
          type: string
        website:
          title: Website URL for the workspace
          type: string
      title: Workspace
    WorkspaceAllowance:
      description: "One limit the workspace's plan sets, with what the workspace has\
        \ used of it."
      example:
        lockedCount: 1
        cycleStartAt: 2000-01-23T04:56:07.000+00:00
        cycleEndAt: 2000-01-23T04:56:07.000+00:00
        kind: ""
        used: 7
        lockedTotalCount: 5
        remaining: 2
        cheapestActionCost: 0
        reached: true
        limit: 6
        recordedCount: 5
        noticeDismissed: true
        resetsOn: ""
        key: ""
      properties:
        cheapestActionCost:
          format: int32
          title: "Platform credits only: the credits the cheapest action that spends\
            \ them needs before it runs"
          type: integer
        cycleEndAt:
          description: The last second of the current cycle; the allowance refills
            one second later. Absent for totals that never refill and when nothing
            has been counted yet.
          format: date-time
          type: string
        cycleStartAt:
          description: Start of the current cycle. Absent when nothing has been counted
            yet.
          format: date-time
          type: string
        key:
          allOf:
          - $ref: "#/components/schemas/PlanLimitKey"
          title: What the limit is on
        kind:
          allOf:
          - $ref: "#/components/schemas/PlanLimitKind"
          title: How the limit behaves
        limit:
          description: The ceiling. Absent when kind is PLAN_LIMIT_KIND_UNLIMITED
            or PLAN_LIMIT_KIND_METERED.
          format: int32
          type: integer
        lockedCount:
          description: "Tracked visits only: visits recorded past the limit in the\
            \ current cycle that the workspace's plan still locks. Absent for other\
            \ limits."
          format: int32
          type: integer
        lockedTotalCount:
          description: "Tracked visits only: every visit the workspace's plan still\
            \ locks, across all cycles. Upgrading to a plan with a higher limit reveals\
            \ them. Absent for other limits."
          format: int32
          type: integer
        noticeDismissed:
          title: Whether the calling member dismissed the over-limit notice for this
            limit in the current cycle
          type: boolean
        reached:
          description: "Whether the limit is used up for the current cycle. Platform\
            \ credits count as reached once neither the monthly credits nor the purchased\
            \ top-up credits hold cheapest_action_cost, so nothing that spends credits\
            \ can run. Never reached on a plan billed per unit used."
          type: boolean
        recordedCount:
          description: "Tracked visits only: every visit recorded in the current cycle,\
            \ used plus locked_count. Absent for other limits."
          format: int32
          type: integer
        remaining:
          description: "Units left in the current cycle. For platform credits, the\
            \ monthly credits left plus the purchased top-up credits left. Absent\
            \ when there is no ceiling."
          format: int32
          type: integer
        resetsOn:
          allOf:
          - $ref: "#/components/schemas/typeDate"
          description: "The day the allowance refills, which is the first day of the\
            \ next cycle in the workspace's timezone. Absent for totals that never\
            \ refill and when nothing has been counted yet."
        used:
          description: "Units used in the current cycle. For a total such as custom\
            \ domains, what the workspace holds."
          format: int32
          type: integer
      title: WorkspaceAllowance
    WorkspaceInsight:
      description: |-
        Derived workspace usage insight that helps the UI pre-select the right link type when creating new links.
        Results are cached in Redis and refreshed on every successful link creation.
      example:
        preferredLinkType: ""
      properties:
        preferredLinkType:
          allOf:
          - $ref: "#/components/schemas/PreferredLinkType"
          title: The dominant link type used by the workspace
      title: WorkspaceInsight
    WorkspaceMetric:
      description: Snapshot of high-level counters Linkbreakers surfaces on the dashboard
        so teams can track workspace growth at a glance.
      example:
        totalMembers: 9
        totalEvents: 2
        totalLinks: 7
        topupCreditsUsed: 5
        totalMonthlyEvents: 3
        tokenCreditsUsed: 6
        totalDirectories: 5
        tokenCreditsLimit: 0
        topupCreditsLimit: 1
        totalPageThemeTemplates: 2
        totalQrcodeTemplates: 4
      properties:
        tokenCreditsLimit:
          format: int32
          title: Monthly platform credits limit for the current cycle (0 means unlimited)
          type: integer
        tokenCreditsUsed:
          format: int32
          title: Monthly platform credits consumed in the current cycle
          type: integer
        topupCreditsLimit:
          format: int32
          title: Top-up credits total purchased (available = limit - used)
          type: integer
        topupCreditsUsed:
          format: int32
          title: Top-up credits consumed (from purchased credit packs)
          type: integer
        totalDirectories:
          format: int32
          title: Total number of directories (including subdirectories) in the workspace
          type: integer
        totalEvents:
          format: int32
          title: Historical count of events generated by the workspace
          type: integer
        totalLinks:
          format: int32
          title: Number of short links created within the workspace
          type: integer
        totalMembers:
          format: int32
          title: Total number of active members in the workspace
          type: integer
        totalMonthlyEvents:
          format: int32
          title: Events created within the current rolling month window
          type: integer
        totalPageThemeTemplates:
          format: int32
          title: Number of page theme templates owned by the workspace
          type: integer
        totalQrcodeTemplates:
          format: int32
          title: Number of QR code templates owned by the workspace
          type: integer
      title: WorkspaceMetric
    WorkspaceToken:
      description: |-
        Describes a long-lived credential Linkbreakers issues so back-end integrations can call workspace APIs
        without a human session, while keeping auditing metadata for security reviews.
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        createdBy: 123e4567-e89b-12d3-a456-426614174000
        fullAccess: true
        lastUsedAt: 2000-01-23T04:56:07.000+00:00
        name: Production token
        id: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
        scopes:
        - API_SCOPE_UNSPECIFIED
        - API_SCOPE_UNSPECIFIED
        keyType: WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED
        updatedAt: 2000-01-23T04:56:07.000+00:00
        workspaceId: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
      properties:
        createdAt:
          format: date-time
          readOnly: true
          title: The timestamp when the token was created
          type: string
        createdBy:
          example: 123e4567-e89b-12d3-a456-426614174000
          title: The member who created the token (UUID of creator)
          type: string
        fullAccess:
          description: |-
            True when the token may call every endpoint, including ones behind scopes
            added later. Tokens created without scopes have full access.
          readOnly: true
          type: boolean
        id:
          example: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
          title: The unique identifier of the workspace token (UUID)
          type: string
        keyType:
          description: |-
            - WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED: Default value (should not be used)
             - WORKSPACE_TOKEN_KEY_TYPE_SECRET: Secret key with full API access
             - WORKSPACE_TOKEN_KEY_TYPE_PUBLISHABLE: Publishable key with limited access
          enum:
          - WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED
          - WORKSPACE_TOKEN_KEY_TYPE_SECRET
          - WORKSPACE_TOKEN_KEY_TYPE_PUBLISHABLE
          readOnly: true
          title: The key type of the token (secret or publishable)
          type: string
        lastUsedAt:
          format: date-time
          readOnly: true
          title: The timestamp when the token was last used
          type: string
        name:
          example: Production token
          title: The name of the token
          type: string
        scopes:
          description: "The scopes the token holds. With full access, every scope\
            \ that exists today."
          items:
            description: |-
              ApiScope is one permission an API token or OAuth grant can hold.

              A write scope also grants the read scope of the same resource.

               - API_SCOPE_UNSPECIFIED: Not a scope. Rejected wherever a scope is expected.
               - API_SCOPE_LINKS_READ: Read links, their QR code images, tags, folders and link settings.
               - API_SCOPE_LINKS_WRITE: Create, update and delete links, tags, folders and link settings.
               - API_SCOPE_WORKFLOWS_READ: Read the workflow steps behind a link and validate them.
               - API_SCOPE_WORKFLOWS_WRITE: Create, connect, update, lay out and delete workflow steps.
               - API_SCOPE_QRCODES_READ: Read QR code designs and QR code templates.
               - API_SCOPE_QRCODES_WRITE: Change QR code designs and create, publish and delete QR code templates.
               - API_SCOPE_PAGE_THEMES_READ: Read page themes and page theme templates.
               - API_SCOPE_PAGE_THEMES_WRITE: Change page themes and create, publish and delete page theme templates.
               - API_SCOPE_MEDIA_READ: Read uploaded media.
               - API_SCOPE_MEDIA_WRITE: Upload and delete media.
               - API_SCOPE_DOMAINS_READ: Read custom domains and their DNS instructions.
               - API_SCOPE_DOMAINS_WRITE: Add, verify, update and delete custom domains.
               - API_SCOPE_VISITORS_READ: Read and search visitors and their attributes.
               - API_SCOPE_VISITORS_WRITE: Identify, update and delete visitors and their attributes.
               - API_SCOPE_ANALYTICS_READ: Read events, metrics, time series, analytics data and dashboards.
               - API_SCOPE_ANALYTICS_WRITE: Create, update and delete analytics dashboards and generate widget summaries.
               - API_SCOPE_WEBHOOKS_READ: Read webhooks.
               - API_SCOPE_WEBHOOKS_WRITE: Create, update and delete webhooks.
               - API_SCOPE_INTEGRATIONS_READ: Read the Slack and Google Forms integrations.
               - API_SCOPE_INTEGRATIONS_WRITE: Connect, configure, test, sync and disconnect the Slack and Google Forms integrations.
               - API_SCOPE_WORKSPACE_READ: Read the workspace and its settings.
               - API_SCOPE_WORKSPACE_WRITE: Update the workspace, request enrollment and delete the workspace.
               - API_SCOPE_MEMBERS_READ: Read workspace members.
               - API_SCOPE_MEMBERS_WRITE: Update, revoke, sign out and remove members. Inviting a member or changing a sign-in email or password needs full access.
               - API_SCOPE_TOKENS_READ: Read API tokens and their scopes, never their secrets.
               - API_SCOPE_TOKENS_WRITE: Create, update and delete API tokens, limited to the scopes the calling token holds.
               - API_SCOPE_BILLING_WRITE: Open checkout, credit top-up and billing portal sessions.
               - API_SCOPE_ASSISTANT_READ: Read the Assistant conversation.
               - API_SCOPE_ASSISTANT_WRITE: Send files to the Assistant, clear the conversation and contact support.
            enum:
            - API_SCOPE_UNSPECIFIED
            - API_SCOPE_LINKS_READ
            - API_SCOPE_LINKS_WRITE
            - API_SCOPE_WORKFLOWS_READ
            - API_SCOPE_WORKFLOWS_WRITE
            - API_SCOPE_QRCODES_READ
            - API_SCOPE_QRCODES_WRITE
            - API_SCOPE_PAGE_THEMES_READ
            - API_SCOPE_PAGE_THEMES_WRITE
            - API_SCOPE_MEDIA_READ
            - API_SCOPE_MEDIA_WRITE
            - API_SCOPE_DOMAINS_READ
            - API_SCOPE_DOMAINS_WRITE
            - API_SCOPE_VISITORS_READ
            - API_SCOPE_VISITORS_WRITE
            - API_SCOPE_ANALYTICS_READ
            - API_SCOPE_ANALYTICS_WRITE
            - API_SCOPE_WEBHOOKS_READ
            - API_SCOPE_WEBHOOKS_WRITE
            - API_SCOPE_INTEGRATIONS_READ
            - API_SCOPE_INTEGRATIONS_WRITE
            - API_SCOPE_WORKSPACE_READ
            - API_SCOPE_WORKSPACE_WRITE
            - API_SCOPE_MEMBERS_READ
            - API_SCOPE_MEMBERS_WRITE
            - API_SCOPE_TOKENS_READ
            - API_SCOPE_TOKENS_WRITE
            - API_SCOPE_BILLING_WRITE
            - API_SCOPE_ASSISTANT_READ
            - API_SCOPE_ASSISTANT_WRITE
            type: string
          readOnly: true
          type: array
        updatedAt:
          format: date-time
          readOnly: true
          title: The timestamp when the token was last updated
          type: string
        workspaceId:
          example: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
          title: The workspace ID the token belongs to (UUID)
          type: string
      title: WorkspaceToken
    WorkspaceTokenKeyType:
      default: WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED
      description: |-
        - WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED: Default value (should not be used)
         - WORKSPACE_TOKEN_KEY_TYPE_SECRET: Secret key with full API access
         - WORKSPACE_TOKEN_KEY_TYPE_PUBLISHABLE: Publishable key with limited access
      enum:
      - WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED
      - WORKSPACE_TOKEN_KEY_TYPE_SECRET
      - WORKSPACE_TOKEN_KEY_TYPE_PUBLISHABLE
      title: WorkspaceTokenKeyType defines the access level of a workspace token
      type: string
