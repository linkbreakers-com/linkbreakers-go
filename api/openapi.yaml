    WorkflowIssue:
      example:
        severity: severity
        stepType: stepType
        stepId: stepId
        message: message
      properties:
        message:
          type: string
        severity:
          title: '"error" or "warning"'
          type: string
        stepId:
          type: string
        stepType:
          type: string
    WorkflowStep:
      description: |-
        Models a node in the Linkbreakers workflow canvas, defining what should occur after a scan (redirects, gates,
        forms) and how it connects to other steps in the visitor journey.
      example:
        kind: KIND_INTERACTION
        canvasPosition: ""
        branches:
        - branchId: branchId
          nextStepId: nextStepId
          label: label
        - branchId: branchId
          nextStepId: nextStepId
          label: label
        nodeType: NODE_TYPE_COMPOSITE
        eventAction: EVENT_ACTION_CLIENT_REDIRECT
        attributeCapture: ""
        createdAt: 2000-01-23T04:56:07.000+00:00
        linkId: 123e4567-e89b-12d3-a456-426614174000
        payload: ""
        childStepIds:
        - childStepIds
        - childStepIds
        id: a5f7b184-9d74-4f2a-9ed9-8f6a98cb12f4
        parentStepIds:
        - parentStepIds
        - parentStepIds
        updatedAt: 2000-01-23T04:56:07.000+00:00
      externalDocs:
        description: Learn more about workflows in Linkbreakers
        url: https://linkbreakers.com/help/article/whats-a-workflow
      properties:
        attributeCapture:
          allOf:
          - $ref: "#/components/schemas/AttributeCapture"
          description: |-
            What this step saves to the visitor's profile when a visitor goes through
            it. Absent when the step has never been configured to save anything.
        branches:
          description: |-
            Every exit of this step, with its current destination.

            This is the vocabulary for connecting the step: pass one of these
            branch_ids to workflow_steps_connect. An atomic step has exactly one
            branch, "next". A composite step has one per button, option or range,
            plus "else" for a condition's fallback. An exit step has none.
          items:
            $ref: "#/components/schemas/WorkflowStepBranch"
          readOnly: true
          type: array
        canvasPosition:
          allOf:
          - $ref: "#/components/schemas/CanvasPosition"
          title: Canvas position for React Flow visualization
        childStepIds:
          items:
            type: string
          readOnly: true
          title: "Child workflow step IDs (steps that this step can transition to,\
            \ UUID)"
          type: array
        createdAt:
          format: date-time
          readOnly: true
          title: When the workflow step was created
          type: string
        eventAction:
          description: |-
            - EVENT_ACTION_UNSPECIFIED: Event action not specified
             - EVENT_ACTION_CLIENT_REDIRECT: Redirect visitors to a destination URL
             - EVENT_ACTION_LINK_VISIT: Entry step triggered when the link is visited.
             - EVENT_ACTION_PASSWORD_VERIFY: Require visitors to enter a password before proceeding
             - EVENT_ACTION_FORM_SUBMIT: Present a data collection form to visitors
             - EVENT_ACTION_CONTACT_CARD: Generate a vCard (VCF) response with contact information
             - EVENT_ACTION_MULTI_LINK: A page of buttons where each one continues into more workflow: the button
            leads to a next step, not straight out. Records which button the visitor
            pressed, so use it over SOCIAL_LINKS_PAGE when that choice is worth
            measuring or when a branch needs to do more than redirect.
             - EVENT_ACTION_VISIT_TYPE_CONDITION: Route visitors based on whether it's a first or returning visit
             - EVENT_ACTION_COUNTRY_CONDITION: Route visitors based on their country location
             - EVENT_ACTION_DAY_OF_WEEK_CONDITION: Route visitors based on day of week
             - EVENT_ACTION_TIME_OF_DAY_CONDITION: Route visitors based on time of day
             - EVENT_ACTION_DAY_OF_MONTH_CONDITION: Route visitors based on day of month
             - EVENT_ACTION_SPECIFIC_DATE_CONDITION: Route visitors based on specific calendar dates
             - EVENT_ACTION_SOCIAL_LINKS_PAGE: A page of buttons that each leave for an external URL. Social profiles are
            the common case, not the only one: app stores, docs, booking pages and
            storefronts all work, and the name is the only thing about it that is
            social. It is an exit step, so the visitor leaves from here.
             - EVENT_ACTION_DEVICE_TYPE_CONDITION: Route visitors based on device type (e.g. MOBILE, DESKTOP, TABLET)
             - EVENT_ACTION_DEVICE_PLATFORM_CONDITION: Route visitors based on device platform / operating system (e.g. iOS, Android, macOS)
             - EVENT_ACTION_DEVICE_BROWSER_CONDITION: Route visitors based on browser family (e.g. Chrome, Safari, Firefox)
             - EVENT_ACTION_DEVICE_BRAND_CONDITION: Route visitors based on hardware brand (e.g. Apple, Samsung, Google)
             - EVENT_ACTION_DEVICE_ACTOR_CONDITION: Route visitors based on actor classification (e.g. HUMAN, BOT, AGENT)
             - EVENT_ACTION_VISITOR_DATA_CONDITION: Route visitors based on their profile data or custom attributes
             - EVENT_ACTION_THANK_YOU_PAGE: Display a final thank you / completion message (exit step)
             - EVENT_ACTION_MESSAGE_PAGE: Text with ONE way onward: a single button, or a timer that moves the
            visitor automatically. It carries no list of destinations, so a page that
            should offer a choice between two or more places is not this step. Use
            SOCIAL_LINKS_PAGE when the choices leave for external URLs, or MULTI_LINK
            when each choice continues into more workflow.
          enum:
          - EVENT_ACTION_UNSPECIFIED
          - EVENT_ACTION_CLIENT_REDIRECT
          - EVENT_ACTION_LINK_VISIT
          - EVENT_ACTION_PASSWORD_VERIFY
          - EVENT_ACTION_FORM_SUBMIT
          - EVENT_ACTION_CONTACT_CARD
          - EVENT_ACTION_MULTI_LINK
          - EVENT_ACTION_VISIT_TYPE_CONDITION
          - EVENT_ACTION_COUNTRY_CONDITION
          - EVENT_ACTION_DAY_OF_WEEK_CONDITION
          - EVENT_ACTION_TIME_OF_DAY_CONDITION
          - EVENT_ACTION_DAY_OF_MONTH_CONDITION
          - EVENT_ACTION_SPECIFIC_DATE_CONDITION
          - EVENT_ACTION_SOCIAL_LINKS_PAGE
          - EVENT_ACTION_DEVICE_TYPE_CONDITION
          - EVENT_ACTION_DEVICE_PLATFORM_CONDITION
          - EVENT_ACTION_DEVICE_BROWSER_CONDITION
          - EVENT_ACTION_DEVICE_BRAND_CONDITION
          - EVENT_ACTION_DEVICE_ACTOR_CONDITION
          - EVENT_ACTION_VISITOR_DATA_CONDITION
          - EVENT_ACTION_THANK_YOU_PAGE
          - EVENT_ACTION_MESSAGE_PAGE
          example: EVENT_ACTION_CLIENT_REDIRECT
          title: The event action type for this workflow step
          type: string
        id:
          example: a5f7b184-9d74-4f2a-9ed9-8f6a98cb12f4
          title: The unique identifier of the workflow step (UUID)
          type: string
        kind:
          description: |-
            - KIND_UNSPECIFIED: Workflow step kind not specified
             - KIND_ENTRY: Entry steps are automatically triggered when a visitor reaches the workflow
             - KIND_EXIT: Exit steps finalize the workflow (commonly a redirect)
             - KIND_INTERACTION: Interaction steps require visitor input (forms, passwords, etc.)
             - KIND_CONDITION: Condition steps evaluate logic and route to different next steps
          enum:
          - KIND_UNSPECIFIED
          - KIND_ENTRY
          - KIND_EXIT
          - KIND_INTERACTION
          - KIND_CONDITION
          example: KIND_INTERACTION
          readOnly: true
          title: "The kind of workflow step (entry, exit, etc.) - read-only, determined\
            \ by server"
          type: string
        linkId:
          example: 123e4567-e89b-12d3-a456-426614174000
          title: The link ID this workflow step belongs to (UUID)
          type: string
        nodeType:
          description: |-
            The node type says how many exits a step has. Whatever the answer, you
            connect every one of them the same way, with workflow_steps_connect: name
            the branch, name the step it leads to. Read a step's branches field for its
            branch ids.

            Example: a multi-link with 3 buttons has 3 branches, with the buttons' ids.
            A redirect has one branch, "next". A country condition has one branch per
            country plus "else".

             - NODE_TYPE_UNSPECIFIED: Workflow step node type not specified
             - NODE_TYPE_COMPOSITE: Composite steps have one exit per button, option or range, plus "else"
            for a condition's fallback.
            Examples: MULTI_LINK, VISIT_TYPE_CONDITION, COUNTRY_CONDITION,
            DAY_OF_WEEK_CONDITION, TIME_OF_DAY_CONDITION, DAY_OF_MONTH_CONDITION,
            SPECIFIC_DATE_CONDITION, DEVICE_*_CONDITION, VISITOR_DATA_CONDITION
             - NODE_TYPE_ATOMIC: Atomic steps have exactly one exit, branch id "next". Exit steps
            (THANK_YOU_PAGE, CONTACT_CARD, SOCIAL_LINKS_PAGE, CLIENT_REDIRECT) are
            atomic but end the journey, so they have no branches at all.
            Examples: LINK_VISIT, PASSWORD_VERIFY, FORM_SUBMIT, MESSAGE_PAGE
          enum:
          - NODE_TYPE_UNSPECIFIED
          - NODE_TYPE_COMPOSITE
          - NODE_TYPE_ATOMIC
          example: NODE_TYPE_COMPOSITE
          readOnly: true
          title: "The node type of workflow step (composite, atomic) - read-only,\
            \ determined by server"
          type: string
        parentStepIds:
          items:
            type: string
          readOnly: true
          title: "Parent workflow step IDs (steps that can transition into this step,\
            \ UUID)"
          type: array
        payload:
          allOf:
          - $ref: "#/components/schemas/WorkflowStepPayload"
          title: The payload data for this workflow step (varies by event action)
        updatedAt:
          format: date-time
          readOnly: true
          title: When the workflow step was last updated
          type: string
      title: WorkflowStep
    WorkflowStepBranch:
      description: "One exit of a workflow step. Server-derived, returned on every\
        \ step read."
      example:
        branchId: branchId
        nextStepId: nextStepId
        label: label
      properties:
        branchId:
          description: |-
            The id this branch is addressed by: "next" for an atomic step's single
            exit, "else" for a condition's fallback, or the id the branch carries in
            the step's payload — a button id, option id, range id, or country code.
          type: string
        label:
          description: |-
            Human-readable name of the branch: a button's label, a country code, a
            condition option's name, "fallback", "next step".
          type: string
        nextStepId:
          description: The step this branch leads to. Empty when the branch is unconnected.
          type: string
    WorkflowStepKind:
      default: KIND_UNSPECIFIED
      description: |-
        - KIND_UNSPECIFIED: Workflow step kind not specified
         - KIND_ENTRY: Entry steps are automatically triggered when a visitor reaches the workflow
         - KIND_EXIT: Exit steps finalize the workflow (commonly a redirect)
         - KIND_INTERACTION: Interaction steps require visitor input (forms, passwords, etc.)
         - KIND_CONDITION: Condition steps evaluate logic and route to different next steps
      enum:
      - KIND_UNSPECIFIED
      - KIND_ENTRY
      - KIND_EXIT
      - KIND_INTERACTION
      - KIND_CONDITION
      title: Workflow step kinds
      type: string
    WorkflowStepNodeType:
      default: NODE_TYPE_UNSPECIFIED
      description: |-
        The node type says how many exits a step has. Whatever the answer, you
        connect every one of them the same way, with workflow_steps_connect: name
        the branch, name the step it leads to. Read a step's branches field for its
        branch ids.

        Example: a multi-link with 3 buttons has 3 branches, with the buttons' ids.
        A redirect has one branch, "next". A country condition has one branch per
        country plus "else".

         - NODE_TYPE_UNSPECIFIED: Workflow step node type not specified
         - NODE_TYPE_COMPOSITE: Composite steps have one exit per button, option or range, plus "else"
        for a condition's fallback.
        Examples: MULTI_LINK, VISIT_TYPE_CONDITION, COUNTRY_CONDITION,
        DAY_OF_WEEK_CONDITION, TIME_OF_DAY_CONDITION, DAY_OF_MONTH_CONDITION,
        SPECIFIC_DATE_CONDITION, DEVICE_*_CONDITION, VISITOR_DATA_CONDITION
         - NODE_TYPE_ATOMIC: Atomic steps have exactly one exit, branch id "next". Exit steps
        (THANK_YOU_PAGE, CONTACT_CARD, SOCIAL_LINKS_PAGE, CLIENT_REDIRECT) are
        atomic but end the journey, so they have no branches at all.
        Examples: LINK_VISIT, PASSWORD_VERIFY, FORM_SUBMIT, MESSAGE_PAGE
      enum:
      - NODE_TYPE_UNSPECIFIED
      - NODE_TYPE_COMPOSITE
      - NODE_TYPE_ATOMIC
      title: Workflow step node types
      type: string
