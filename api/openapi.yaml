        hideBackgroundDots:
          title: Whether to hide the background dots
          type: boolean
        outputFileFormat:
          description: |-
            - OUTPUT_FILE_FORMAT_UNSPECIFIED: Output format not specified (defaults to PNG server-side)
             - OUTPUT_FILE_FORMAT_SVG: Scalable Vector Graphics format for infinite resolution
             - OUTPUT_FILE_FORMAT_PNG: Portable Network Graphics format with transparency support
             - OUTPUT_FILE_FORMAT_JPEG: Joint Photographic Experts Group format for compressed images
             - OUTPUT_FILE_FORMAT_WEBP: WebP format for modern web-optimized compression
