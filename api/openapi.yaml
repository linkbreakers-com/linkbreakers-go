      description: Request to create a new link.
      example:
        qrcodeDesignId: a8c5e111-8894-4f8a-b5db-9efe0d12a210
        metadata:
          key: metadata
        purpose: "Increase newsletter signups. Good leads: marketing qualified leads\
          \ with budget over $10k."
        conversionTracking: true
        destination: https://example.com
        customDomainId: d290f1ee-6c54-4b01-90e6-d701748f0851
