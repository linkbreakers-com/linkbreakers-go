        workflowStep: ""
        unconnectedBranchIds:
        - unconnectedBranchIds
        - unconnectedBranchIds
      properties:
        disconnectedSteps:
          description: |-
            Steps that nothing can reach now that this connection changed. Empty means
            the whole workflow is still connected.
          items:
            $ref: "#/components/schemas/WorkflowIssue"
          type: array
        unconnectedBranchIds:
          description: |-
            Branches of this step that still lead nowhere, reported without being
            asked for.

            Wiring one branch of a condition and forgetting the rest is the most
            common way a workflow ships broken: the visitor who takes an unwired
            branch falls through to the fallback URL. Nothing here is unreachable, so
            a graph-level check would not catch it — only the step itself knows.
            Empty means every exit of this step leads somewhere.
          items:
            type: string
          type: array
        workflowStep:
          allOf:
          - $ref: "#/components/schemas/WorkflowStep"
          title: "The step the connection leaves from, as it now stands"
      title: Response for connecting a workflow step branch
