    QrcodeDesign:
      description: |-
        Captures the visual recipe Linkbreakers uses when rendering downloadable QR codes, including colors, shapes,
        export options, and center media.

        QR Code Designs are the visual representation of a link.
        They can be attached to QR Code Templates for reusability.
        They can only be attached to one record at a time.
      example:
        errorCorrectionLevel: errorCorrectionLevel
        cornersDotOptions: ""
        dotsOptions: ""
        shape: SHAPE_SQUARE
        hideBackgroundDots: true
        centralImageSignedUrl: centralImageSignedUrl
        createdAt: 2000-01-23T04:56:07.000+00:00
        backgroundOptions: ""
        cornersSquareOptions: ""
        width: 5
        centralImageMargin: 0
        centralImageSize: 6.027456183070403
        id: a8c5e111-8894-4f8a-b5db-9efe0d12a210
        outputFileFormat: OUTPUT_FILE_FORMAT_PNG
        height: 1
        updatedAt: 2000-01-23T04:56:07.000+00:00
      externalDocs:
        description: Learn more about QR code designs in Linkbreakers
        url: https://linkbreakers.com/help/article/whats-a-qr-code-design
      properties:
        backgroundOptions:
          allOf:
          - $ref: "#/components/schemas/BackgroundOptions"
          title: The styling options for the background
        centralImageMargin:
          format: int32
          title: The margin around the central image in pixels
          type: integer
        centralImageSignedUrl:
          readOnly: true
          title: |-
            The signed URL for the central image
            This URL eventually expires
          type: string
        centralImageSize:
          format: double
          title: The size of the central image relative to the QR code (0.0-1.0 proportion)
          type: number
        cornersDotOptions:
          allOf:
          - $ref: "#/components/schemas/CornersDotOptions"
          title: The styling options for the dot corners
        cornersSquareOptions:
          allOf:
          - $ref: "#/components/schemas/CornersSquareOptions"
          title: The styling options for the square corners
        createdAt:
          format: date-time
          readOnly: true
          title: When the QR code design was created
          type: string
        dotsOptions:
          allOf:
          - $ref: "#/components/schemas/DotsOptions"
          title: The styling options for the dots
        errorCorrectionLevel:
          title: "Error correction level forwarded to the QR renderer (\"L\",\"M\"\
            ,\"Q\",\"H\")"
          type: string
        height:
          format: int32
          title: Export height in pixels
          type: integer
        hideBackgroundDots:
          title: Whether to remove dots behind the central image to improve contrast
          type: boolean
        id:
          example: a8c5e111-8894-4f8a-b5db-9efe0d12a210
          title: The unique identifier of the QR code design (UUID)
          type: string
        outputFileFormat:
          description: |-
            - OUTPUT_FILE_FORMAT_UNSPECIFIED: Output format not specified (defaults to PNG server-side)
             - OUTPUT_FILE_FORMAT_SVG: Scalable Vector Graphics format for infinite resolution
             - OUTPUT_FILE_FORMAT_PNG: Portable Network Graphics format with transparency support
             - OUTPUT_FILE_FORMAT_JPEG: Joint Photographic Experts Group format for compressed images
             - OUTPUT_FILE_FORMAT_WEBP: WebP format for modern web-optimized compression
          enum:
          - OUTPUT_FILE_FORMAT_UNSPECIFIED
          - OUTPUT_FILE_FORMAT_SVG
          - OUTPUT_FILE_FORMAT_PNG
          - OUTPUT_FILE_FORMAT_JPEG
          - OUTPUT_FILE_FORMAT_WEBP
          example: OUTPUT_FILE_FORMAT_PNG
          title: The output file format for the QR code
          type: string
        shape:
          description: |-
            - SHAPE_UNSPECIFIED: Shape not specified (defaults to square modules)
             - SHAPE_SQUARE: Traditional square modules for QR code data points
             - SHAPE_CIRCLE: Circular modules for a rounded visual appearance
          enum:
          - SHAPE_UNSPECIFIED
          - SHAPE_SQUARE
          - SHAPE_CIRCLE
          example: SHAPE_SQUARE
          title: The shape of the QR code
          type: string
        updatedAt:
          format: date-time
          readOnly: true
          title: When the QR code design was last updated
          type: string
        width:
          format: int32
          title: Export width in pixels
          type: integer
