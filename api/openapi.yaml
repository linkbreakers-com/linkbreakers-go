        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
          description: "Accepted. The links are being created; poll the job at the\
            \ Location header (GET /v1/jobs/{id})."
          headers:
            Idempotent-Replayed:
              $ref: "#/components/headers/Idempotent-Replayed"
            Location:
              description: "Where to poll the job: GET this path until its status\
                \ is JOB_STATUS_SUCCEEDED or JOB_STATUS_FAILED."
              explode: false
              schema:
                example: /v1/jobs/0b5c7a52-4e0d-4f8a-9a39-5f1f3c0d2e11
                type: string
              style: simple
