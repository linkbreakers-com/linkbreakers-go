    get:
      description: |-
        Retrieves the custom domains for your workspace

        Requires the `domains:read` scope.
      operationId: CustomDomainsService_List
      parameters:
      - description: |-
          Filter by the status of the custom domains to list. Optional.

           - STATUS_UNSPECIFIED: The status is not specified
           - STATUS_INACTIVE: The domain is inactive. It was created but not checked yet.
           - STATUS_DOMAIN_PENDING: The domain is pending. Last time it was checked, it was not pointing to the correct Linkbreakers subdomain.
           - STATUS_VERIFICATION_PENDING: The domain is pending verification. Please verify through TXT record.
           - STATUS_CERTIFICATE_PENDING: The domain is pending certificate. The SSL certificate is not yet ready.
           - STATUS_ACTIVE: The domain is fully active
           - STATUS_RENEWAL_PENDING: The domain is still serving traffic on a valid certificate, but the renewal
          of that certificate cannot be validated. It stops working at certificate_expires_at.
           - STATUS_EXPIRED: The certificate expired or was withdrawn. The domain no longer serves HTTPS.
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - description: "Maximum number of custom domains to return. Defaults to 100,\
          \ capped at 1000."
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - description: |-
          Cursor from a previous response's next_page_token. Empty starts at the
          first page. Pages are ordered by (created_at, id), which never change, so a
          record cannot move between pages while a client is walking them.
        explode: true
        in: query
        name: pageToken
        required: false
        schema:
          type: string
        style: form
      - description: "Opaque cursor from the previous page's nextPageToken. Same as\
          \ pageToken; when both are sent, pageToken wins."
        explode: true
        in: query
        name: cursor
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
