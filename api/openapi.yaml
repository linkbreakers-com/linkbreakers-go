    VisitorAttribute:
      description: VisitorAttribute is one key/value pair on a visitor profile.
      example:
        dateValue: 2000-01-23T04:56:07.000+00:00
        boolValue: true
        numberValue: 0.8008281904610115
        type: VISITOR_ATTRIBUTE_TYPE_UNSPECIFIED
        value: "8"
        key: rating
      properties:
        boolValue:
          type: boolean
        dateValue:
          format: date-time
          type: string
        key:
          example: rating
          title: "Attribute key, for example \"rating\""
          type: string
        numberValue:
          description: |-
            Set only when the value parses as a number. Absent when it does not, so a
            value that contradicts its type is still readable but not aggregatable.
          format: double
          type: number
        type:
          description: |-
            VisitorAttributeType is what a value was captured as. It decides how the
            value is parsed and which analytics the key can support, which the value
            alone cannot tell you: "8" from a rating field and "8" typed into a text box
            are different facts.
          enum:
          - VISITOR_ATTRIBUTE_TYPE_UNSPECIFIED
          - VISITOR_ATTRIBUTE_TYPE_STRING
          - VISITOR_ATTRIBUTE_TYPE_NUMBER
          - VISITOR_ATTRIBUTE_TYPE_BOOLEAN
          - VISITOR_ATTRIBUTE_TYPE_DATE
          - VISITOR_ATTRIBUTE_TYPE_ENUM
          title: What the value was captured as
          type: string
        value:
          description: "The raw value as captured. Always populated, whatever the\
            \ type."
          example: "8"
          type: string
    VisitorAttributeFilter:
      description: |-
        VisitorAttributeFilter narrows a visitor list to visitors whose attribute
        matches. Several filters are combined with AND.
      example:
        value: "800000"
        key: budget
        operator: VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_OR_EQUAL
      properties:
        key:
          description: |-
            Attribute key, for example "budget". Reserved fields ($email, $phone,
            $firstName, $lastName) can be filtered with the STRING_*, EXISTS and
            NOT_EXISTS operators.
          example: budget
          type: string
        operator:
          allOf:
          - $ref: "#/components/schemas/VisitorAttributeFilterOperator"
          example: VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_OR_EQUAL
          title: How the attribute is compared with value
        value:
          description: |-
            Value to compare with: a number for NUMBER_* operators, a date such as
            2026-03-01 or an RFC 3339 timestamp for DATE_* operators. Ignored by
            operators that need no value.
          example: "800000"
          type: string
    VisitorAttributeFilterOperator:
      default: VISITOR_ATTRIBUTE_FILTER_OPERATOR_UNSPECIFIED
      description: |-
        How an attribute filter compares a visitor's attribute with its value. The
        operators are the ones a VISITOR_DATA_CONDITION workflow step uses, so a
        filter and a condition written the same way select the same visitors.

        STRING_* operators compare the raw value and are case-sensitive. An absent
        attribute reads as an empty string, so STRING_NOT_EQUALS, STRING_NOT_CONTAINS
        and STRING_IS_EMPTY also match visitors who do not have the attribute.
        NUMBER_* and DATE_* operators only match values captured as a number or a
        date. BOOLEAN_IS_FALSE matches anything that is not true, including an absent
        attribute.

         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_EQUALS: The attribute equals the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_NOT_EQUALS: The attribute differs from the value, or is absent
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_CONTAINS: The attribute contains the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_NOT_CONTAINS: The attribute does not contain the value, or is absent
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_STARTS_WITH: The attribute starts with the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_ENDS_WITH: The attribute ends with the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_IS_EMPTY: The attribute is empty or absent. No value needed.
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_IS_NOT_EMPTY: The attribute is set to a non-empty value. No value needed.
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_EQUALS: The number equals the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_NOT_EQUALS: The number differs from the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_THAN: The number is greater than the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_LESS_THAN: The number is less than the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_OR_EQUAL: The number is greater than or equal to the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_LESS_OR_EQUAL: The number is less than or equal to the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_EQUALS: The date equals the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_BEFORE: The date is before the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_AFTER: The date is after the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_BEFORE_OR_EQUAL: The date is on or before the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_AFTER_OR_EQUAL: The date is on or after the value
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_BOOLEAN_IS_TRUE: The attribute is true. No value needed.
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_BOOLEAN_IS_FALSE: The attribute is not true, including absent. No value needed.
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_EXISTS: The visitor has the attribute, whatever its value. No value needed.
         - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NOT_EXISTS: The visitor does not have the attribute. No value needed.
      enum:
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_UNSPECIFIED
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_EQUALS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_NOT_EQUALS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_CONTAINS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_NOT_CONTAINS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_STARTS_WITH
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_ENDS_WITH
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_IS_EMPTY
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_STRING_IS_NOT_EMPTY
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_EQUALS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_NOT_EQUALS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_THAN
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_LESS_THAN
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_GREATER_OR_EQUAL
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NUMBER_LESS_OR_EQUAL
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_EQUALS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_BEFORE
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_AFTER
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_BEFORE_OR_EQUAL
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_DATE_AFTER_OR_EQUAL
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_BOOLEAN_IS_TRUE
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_BOOLEAN_IS_FALSE
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_EXISTS
      - VISITOR_ATTRIBUTE_FILTER_OPERATOR_NOT_EXISTS
      type: string
    VisitorAttributeKey:
