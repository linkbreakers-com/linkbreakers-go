        - workflows:write
      - oauth2:
        - workflows:write
      summary: Clear one exit of a workflow step
      tags:
      - Workflow Steps
      x-required-scope: workflows:write
    put:
      description: |-
        Every workflow step is connected the same way: name the branch it leaves
        from, and the step it leads to.

        Atomic steps (redirect, password, form, message page) have exactly one
        branch, "next". Composite steps (multi-link, conditions) have one branch
        per button, option or range, plus "else" for a condition's fallback. Exit
        steps end the journey and have no branches at all.

        Read a step to see its branches, their ids and their current destinations.
        Idempotent: connecting a branch to the step it already leads to is a no-op.

        Requires the `workflows:write` scope.
      operationId: WorkflowStepsService_ConnectStep
      parameters:
      - description: The ID of the link (UUID)
        explode: false
        in: path
