      operationId: AssistantService_ClearConversation
      parameters:
      - description: |2-
           - ASSISTANT_CONTEXT_TYPE_LINK_ANALYTICS: Building a link's analytics dashboard. context_id is the LINK id, not a
          dashboard id — the dashboard does not exist yet while the user and the
          assistant are still agreeing on what it should show. Once it exists,
          editing it happens under ASSISTANT_CONTEXT_TYPE_ANALYTICS_DASHBOARD instead.
           - ASSISTANT_CONTEXT_TYPE_WORKSPACE: The workspace-wide assistant, with no resource selected. The context id is
          the WORKSPACE id: this thread is not about any one link, dashboard or
          design, and every capability the resource-scoped assistants have is available
          from it. One conversation per workspace, so it survives navigation.
        explode: true
        in: query
        name: contextType
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: contextId
        required: false
        schema:
          type: string
        style: form
