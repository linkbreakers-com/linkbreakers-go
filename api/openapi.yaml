    SocketAssistantErrorMessage:
      description: SocketAssistantErrorMessage says why there will be no reply.
      properties:
        errorCode:
          $ref: "#/components/schemas/SocketErrorCode"
        message:
          type: string
        requestId:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketAssistantProgressMessage:
      description: |-
        SocketAssistantProgressMessage says what the assistant is doing while it works.

        A reply can take a model several tool calls to produce. Without these the
        screen has nothing to show for that time.
      properties:
        detail:
          type: string
        requestId:
          type: string
        step:
          description: "\"thinking\", \"calling_tool\", and so on."
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketAssistantResponseMessage:
      description: SocketAssistantResponseMessage is the assistant's reply to one
        message.
      properties:
        appliedActions:
          items:
            type: string
          type: array
        contextUpdated:
          description: "True when the assistant changed the resource, so the screen\
            \ should re-read it."
          type: boolean
        requestId:
          type: string
        responseText:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
        uiActions:
          items:
            $ref: "#/components/schemas/ChatUIAction"
          type: array
    SocketAssistantSendRequest:
      description: SocketAssistantSendRequest asks the assistant for a reply.
      properties:
        contextId:
          type: string
        contextMetadata:
          description: Whatever the page knows and the assistant cannot see.
          type: string
        contextType:
          type: string
        fileIds:
          description: "Files already uploaded, to attach to this turn."
          items:
            type: string
          type: array
        message:
          type: string
        requestId:
          description: Correlates the reply to this message. The client generates
            it.
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketConnectedMessage:
      description: SocketConnectedMessage confirms the socket is authenticated.
      properties:
        memberId:
          type: string
        sessionId:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
        workspaceId:
          type: string
    SocketContract:
      description: |-
        SocketContract names every frame the socket carries.

        Its fields are what put these messages in the generated clients: a websocket
        has no HTTP operation of its own, and a message no operation mentions is not
        emitted. The endpoint answers with the protocol version; the rest of this
        message is the schema both sides are generated from.
      properties:
        assistantError:
          $ref: "#/components/schemas/SocketAssistantErrorMessage"
        assistantProgress:
          $ref: "#/components/schemas/SocketAssistantProgressMessage"
        assistantResponse:
          $ref: "#/components/schemas/SocketAssistantResponseMessage"
        assistantSend:
          $ref: "#/components/schemas/SocketAssistantSendRequest"
        connected:
          $ref: "#/components/schemas/SocketConnectedMessage"
        event:
          $ref: "#/components/schemas/SocketEventMessage"
        ping:
          $ref: "#/components/schemas/SocketPingRequest"
        pong:
          $ref: "#/components/schemas/SocketPongMessage"
        protocolVersion:
          type: string
        subscribe:
          $ref: "#/components/schemas/SocketSubscribeRequest"
        subscribeDenied:
          $ref: "#/components/schemas/SocketSubscribeDeniedMessage"
        subscribed:
          $ref: "#/components/schemas/SocketSubscribedMessage"
        unsubscribe:
          $ref: "#/components/schemas/SocketUnsubscribeRequest"
    SocketErrorCode:
      default: SOCKET_ERROR_CODE_UNSPECIFIED
      description: |-
        SocketErrorCode is why a request could not be served.

         - SOCKET_ERROR_CODE_FORBIDDEN: The caller asked for something outside their workspace.
      enum:
      - SOCKET_ERROR_CODE_UNSPECIFIED
      - SOCKET_ERROR_CODE_RATE_LIMITED
      - SOCKET_ERROR_CODE_CREDITS_EXHAUSTED
      - SOCKET_ERROR_CODE_WORKSPACE_NOT_VERIFIED
      - SOCKET_ERROR_CODE_BUSY
      - SOCKET_ERROR_CODE_INVALID_CONTEXT
      - SOCKET_ERROR_CODE_INTERNAL_ERROR
      - SOCKET_ERROR_CODE_FORBIDDEN
      type: string
    SocketEventMessage:
      description: |-
        SocketEventMessage carries something that happened, to everyone on a channel.

        This is the frame the local-first client listens for: a change hint tells it
        its copy may be behind, and it answers by re-reading. It was the one frame
        not in this contract, sent as the broadcast layer's own JSON, and it worked
        only because the client hand-parses a `type` field and the two vocabularies
        happened not to collide. A client generated strictly from this file would
        have dropped every one of them.

        The payload stays opaque. What is in it belongs to the domain that raised
        the event, and naming those shapes here would make this file change every
        time one of them did.
      properties:
        channel:
          description: "Which channel carried it, so a client on several can tell\
            \ them apart."
          type: string
        event:
          description: "What happened, as the domain named it."
          type: string
        payload:
          description: "The event's own body, as JSON."
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketMessageType:
      default: SOCKET_MESSAGE_TYPE_UNSPECIFIED
      description: |-
        SocketMessageType is the discriminator every frame carries.

         - SOCKET_MESSAGE_TYPE_ASSISTANT_SEND: Client to server.
         - SOCKET_MESSAGE_TYPE_CONNECTED: Server to client.
      enum:
      - SOCKET_MESSAGE_TYPE_UNSPECIFIED
      - SOCKET_MESSAGE_TYPE_ASSISTANT_SEND
      - SOCKET_MESSAGE_TYPE_SUBSCRIBE
      - SOCKET_MESSAGE_TYPE_UNSUBSCRIBE
      - SOCKET_MESSAGE_TYPE_PING
      - SOCKET_MESSAGE_TYPE_CONNECTED
      - SOCKET_MESSAGE_TYPE_ASSISTANT_RESPONSE
      - SOCKET_MESSAGE_TYPE_ASSISTANT_PROGRESS
      - SOCKET_MESSAGE_TYPE_ASSISTANT_ERROR
      - SOCKET_MESSAGE_TYPE_SUBSCRIBED
      - SOCKET_MESSAGE_TYPE_SUBSCRIBE_DENIED
      - SOCKET_MESSAGE_TYPE_PONG
      - SOCKET_MESSAGE_TYPE_EVENT
      type: string
    SocketPingRequest:
      description: SocketPingRequest keeps the connection alive from the client side.
      properties:
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketPongMessage:
      description: SocketPongMessage answers a ping.
      properties:
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketSubscribeDeniedMessage:
      description: |-
        SocketSubscribeDeniedMessage refuses a channel the caller may not read.

        Said out loud rather than dropped silently: a client that believes it is
        subscribed and receives nothing cannot tell that apart from a quiet channel.
      properties:
        channel:
          type: string
        code:
          $ref: "#/components/schemas/SocketErrorCode"
        message:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketSubscribeRequest:
      description: SocketSubscribeRequest joins a channel.
      properties:
        channel:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketSubscribedMessage:
      description: SocketSubscribedMessage confirms a channel was joined.
      properties:
        channel:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SocketUnsubscribeRequest:
      description: SocketUnsubscribeRequest leaves a channel.
      properties:
        channel:
          type: string
        type:
          $ref: "#/components/schemas/SocketMessageType"
    SortDirection:
      default: SORT_DIRECTION_UNSPECIFIED
      description: |-
        SortDirection is the ordering applied to any sortable list endpoint.
        Shared across resources so a caller learns it once.

         - SORT_DIRECTION_UNSPECIFIED: Sort direction not specified (defaults to descending)
         - SORT_DIRECTION_ASC: Sort in ascending order
         - SORT_DIRECTION_DESC: Sort in descending order
      enum:
      - SORT_DIRECTION_UNSPECIFIED
      - SORT_DIRECTION_ASC
      - SORT_DIRECTION_DESC
      type: string
