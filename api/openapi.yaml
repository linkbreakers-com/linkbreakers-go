    AttributeCapture:
      description: |-
        A step's opt-in to save values to the visitor's profile, so a workflow can
        record qualification without a form: a tapped choice, a milestone reached,
        or the context of the link that was scanned.

        Available on every step except conditions, which only route on what is
        already known. A failed password attempt or a skipped form saves nothing.
        On forms it saves on top of the answers, which forms already save.
      properties:
        enabled:
          description: Off keeps the configured writes without running them.
          type: boolean
        writes:
          description: Up to 20 values to save. Each runs when the visitor goes through
            the step.
          items:
            $ref: "#/components/schemas/AttributeWrite"
          type: array
    AttributeValueDataPoint:
      example:
        visitorCount: 6
        percentage: 0.8008281904610115
        label: label
      properties:
        label:
          type: string
        percentage:
          format: double
          type: number
        visitorCount:
          format: int32
          type: integer
      title: AttributeValueDataPoint is one value of an attribute with how many visitors
        hold it
    AttributeValueEntry:
      example:
        recordedAt: 2000-01-23T04:56:07.000+00:00
        value: value
      properties:
        recordedAt:
          format: date-time
          title: When the visitor last set it
          type: string
        value:
          title: The value as captured
          type: string
      title: AttributeValueEntry is one recorded value of an attribute
    AttributeWrite:
      description: One value saved to the visitor's profile.
      properties:
        key:
          description: |-
            The attribute key, such as "looking_for" or "book_a_viewing_at". Letters,
            digits, "_", "-" and "."; keys starting with "$" are reserved.
          example: looking_for
          type: string
        mode:
          description: |2-
             - ATTRIBUTE_WRITE_MODE_SET: Overwrite, so the profile holds the latest value.
             - ATTRIBUTE_WRITE_MODE_SET_ONCE: Keep the first value, for first-touch facts.
          enum:
          - ATTRIBUTE_WRITE_MODE_UNSPECIFIED
          - ATTRIBUTE_WRITE_MODE_SET
          - ATTRIBUTE_WRITE_MODE_SET_ONCE
          type: string
        type:
          description: |-
            VisitorAttributeType is what a value was captured as. It decides how the
            value is parsed and which analytics the key can support, which the value
            alone cannot tell you: "8" from a rating field and "8" typed into a text box
            are different facts.
          enum:
          - VISITOR_ATTRIBUTE_TYPE_UNSPECIFIED
          - VISITOR_ATTRIBUTE_TYPE_STRING
          - VISITOR_ATTRIBUTE_TYPE_NUMBER
          - VISITOR_ATTRIBUTE_TYPE_BOOLEAN
          - VISITOR_ATTRIBUTE_TYPE_DATE
          - VISITOR_ATTRIBUTE_TYPE_ENUM
          type: string
        value:
          description: |-
            Literal text, or a template filled in when the visitor goes through the
            step: {{now}}, {{link.name}}, {{link.metadata.<key>}}, and on MULTI_LINK
            steps {{choice.label}} and {{choice.id}} for the button tapped. A write
            whose value comes out empty is skipped.
          example: "{{choice.label}}"
          type: string
    AttributeWriteMode:
      default: ATTRIBUTE_WRITE_MODE_UNSPECIFIED
      description: |2-
         - ATTRIBUTE_WRITE_MODE_SET: Overwrite, so the profile holds the latest value.
         - ATTRIBUTE_WRITE_MODE_SET_ONCE: Keep the first value, for first-touch facts.
      enum:
      - ATTRIBUTE_WRITE_MODE_UNSPECIFIED
      - ATTRIBUTE_WRITE_MODE_SET
      - ATTRIBUTE_WRITE_MODE_SET_ONCE
      type: string
