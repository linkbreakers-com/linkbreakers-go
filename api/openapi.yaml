        - DNS_RECORD_PURPOSE_UNSPECIFIED: Not specified
         - DNS_RECORD_PURPOSE_ROUTING: Sends the domain's traffic to Linkbreakers
         - DNS_RECORD_PURPOSE_CERTIFICATE_DELEGATION: Lets the certificate provider issue and renew the HTTPS certificate on its own
         - DNS_RECORD_PURPOSE_OWNERSHIP: Proves ownership of the domain
