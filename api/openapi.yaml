      title: Update a visitor by ID with partial attributes
    Webhook:
      description: |-
        Describes a webhook endpoint that receives event notifications when specified conditions are met,
        providing real-time integration capabilities for external systems.
      example:
        lastSentAt: 2000-01-23T04:56:07.000+00:00
        source: WEBHOOK_SOURCE_LINKBREAKERS
        triggers:
        - KIND_ENTRY
        - KIND_EXIT
        createdAt: 2000-01-23T04:56:07.000+00:00
        linkId: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
        createdBy: 123e4567-e89b-12d3-a456-426614174000
        endpointUrl: https://api.example.com/webhooks/linkbreakers
        lastDeliveredAt: 2000-01-23T04:56:07.000+00:00
        name: Production Event Notifications
        successCount: successCount
        id: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
        failureCount: failureCount
        status: WEBHOOK_STATUS_ACTIVE
        updatedAt: 2000-01-23T04:56:07.000+00:00
        workspaceId: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
      externalDocs:
        description: Learn more about webhooks in Linkbreakers
        url: https://linkbreakers.com/help/article/how-do-webhooks-work-in-linkbreakers
      properties:
        createdAt:
          format: date-time
          readOnly: true
          title: The timestamp when the webhook was created
          type: string
        createdBy:
          example: 123e4567-e89b-12d3-a456-426614174000
          title: The member who created the webhook (UUID)
          type: string
        endpointUrl:
          example: https://api.example.com/webhooks/linkbreakers
          title: The URL endpoint that will receive webhook POST requests
          type: string
        failureCount:
          format: int64
          readOnly: true
          title: Count of failed webhook deliveries
          type: string
        id:
          example: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
          title: The unique identifier of the webhook (UUID)
          type: string
        lastDeliveredAt:
          description: |-
            The timestamp when the webhook was last successfully delivered to the endpoint.
            This field is only updated when the webhook endpoint responds with a 2xx status code.
            Use this to track actual successful event notifications to external systems.
          format: date-time
          readOnly: true
          type: string
        lastSentAt:
          description: |-
            The timestamp when the webhook was last triggered (attempted), regardless of success or failure.
            This field is updated on every webhook transmission attempt, including failed deliveries.
            Use this to track webhook activity and debugging transmission issues.
          format: date-time
          readOnly: true
          type: string
        linkId:
          description: |-
            Filter webhook notifications by a specific link ID.
            Only events from this link will trigger webhook notifications.
            If empty, all links in the workspace will trigger notifications.
          example: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
          type: string
        name:
          example: Production Event Notifications
          title: The name of the webhook
          type: string
        source:
          allOf:
          - $ref: "#/components/schemas/WebhookSource"
          example: WEBHOOK_SOURCE_LINKBREAKERS
          title: "Source of the webhook - indicates whether it was created manually\
            \ through \nthe dashboard or automatically via an integration platform"
        status:
          allOf:
          - $ref: "#/components/schemas/WebhookStatus"
          example: WEBHOOK_STATUS_ACTIVE
          title: Current status of the webhook
        successCount:
          format: int64
          readOnly: true
          title: Count of successful webhook deliveries
          type: string
        triggers:
          description: |-
            Filter webhook notifications by workflow step kinds.
            Only workflow steps matching these kinds will trigger webhook notifications.
            If empty, all workflow step kinds will trigger notifications.
          example:
          - KIND_ENTRY
          - KIND_EXIT
          items:
            description: |-
              - KIND_UNSPECIFIED: Workflow step kind not specified
               - KIND_ENTRY: Entry steps are automatically triggered when a visitor reaches the workflow
               - KIND_EXIT: Exit steps finalize the workflow (commonly a redirect)
               - KIND_INTERACTION: Interaction steps require visitor input (forms, passwords, etc.)
               - KIND_CONDITION: Condition steps evaluate logic and route to different next steps
            enum:
            - KIND_UNSPECIFIED
            - KIND_ENTRY
            - KIND_EXIT
            - KIND_INTERACTION
            - KIND_CONDITION
            type: string
          type: array
        updatedAt:
          format: date-time
          readOnly: true
          title: The timestamp when the webhook was last updated
          type: string
        workspaceId:
          example: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
          title: The workspace ID the webhook belongs to (UUID)
          type: string
      title: Webhook
    WebhookSource:
      default: WEBHOOK_SOURCE_UNSPECIFIED
      description: |-
        - WEBHOOK_SOURCE_UNSPECIFIED: Webhook source not specified (defaults to LINKBREAKERS)
         - WEBHOOK_SOURCE_LINKBREAKERS: Webhook created manually through the Linkbreakers dashboard/platform
         - WEBHOOK_SOURCE_MAKE: Webhook created automatically via Make.com integration
         - WEBHOOK_SOURCE_ZAPIER: Webhook created automatically via Zapier integration
      enum:
      - WEBHOOK_SOURCE_UNSPECIFIED
      - WEBHOOK_SOURCE_LINKBREAKERS
      - WEBHOOK_SOURCE_MAKE
      - WEBHOOK_SOURCE_ZAPIER
      title: "The source of a webhook - indicates whether the webhook was created\
        \ manually \nthrough the Linkbreakers dashboard or automatically via an integration\
        \ platform such as Make.com or Zapier"
      type: string
    WebhookStatus:
      default: WEBHOOK_STATUS_UNSPECIFIED
      description: |-
        - WEBHOOK_STATUS_UNSPECIFIED: Webhook status not specified
         - WEBHOOK_STATUS_ACTIVE: Webhook is active and receiving events
         - WEBHOOK_STATUS_DISABLED: Webhook is disabled due to repeated failures
         - WEBHOOK_STATUS_PAUSED: Webhook is paused by user action
      enum:
      - WEBHOOK_STATUS_UNSPECIFIED
      - WEBHOOK_STATUS_ACTIVE
      - WEBHOOK_STATUS_DISABLED
      - WEBHOOK_STATUS_PAUSED
      title: The status of a webhook
      type: string
    WebhooksServiceUpdateBody:
      example:
        linkId: linkId
        endpointUrl: endpointUrl
        name: name
        source: ""
        triggers:
        - KIND_UNSPECIFIED
        - KIND_UNSPECIFIED
        status: ""
      properties:
        endpointUrl:
          title: The URL endpoint that will receive webhook POST requests
          type: string
        linkId:
          description: |-
            Filter webhook notifications by a specific link ID.
            Only events from this link will trigger webhook notifications.
            If empty, all links in the workspace will trigger notifications.
          type: string
        name:
          title: The name of the webhook
          type: string
        source:
          allOf:
          - $ref: "#/components/schemas/WebhookSource"
          title: Source of the webhook - indicates whether created manually or via
            integration
        status:
          allOf:
          - $ref: "#/components/schemas/WebhookStatus"
          title: Current status of the webhook
        triggers:
          description: |-
            Filter webhook notifications by workflow step kinds.
            Only workflow steps matching these kinds will trigger webhook notifications.
            If empty, all workflow step kinds will trigger notifications.
          items:
            description: |-
              - KIND_UNSPECIFIED: Workflow step kind not specified
               - KIND_ENTRY: Entry steps are automatically triggered when a visitor reaches the workflow
               - KIND_EXIT: Exit steps finalize the workflow (commonly a redirect)
               - KIND_INTERACTION: Interaction steps require visitor input (forms, passwords, etc.)
               - KIND_CONDITION: Condition steps evaluate logic and route to different next steps
            enum:
            - KIND_UNSPECIFIED
            - KIND_ENTRY
            - KIND_EXIT
            - KIND_INTERACTION
            - KIND_CONDITION
            type: string
          type: array
      title: UpdateWebhookRequest represents the request to update a webhook
    WidgetDataSource:
      properties:
        endpoint:
          title: "The API endpoint path, e.g. \"/v1/timeseries/events\""
          type: string
        method:
          title: "HTTP method: \"GET\" or \"POST\""
          type: string
        params:
          title: Static parameters always sent with the request
          type: object
        responseDataPath:
          title: |-
            Dot-notation path to the data array in the response, e.g. "timeSeries.data" or "data"
            Empty string means the root object is the data (for single-value endpoints like metrics)
          type: string
        usesDateRange:
          title: Whether the dashboard date range should be injected (startDate/endDate)
          type: boolean
        usesInterval:
          title: Whether interval calculation should be injected (for time-bucketed
            data)
          type: boolean
      title: WidgetDataSource describes which API endpoint to call and how to pass
        parameters
    WidgetFieldMapping:
      properties:
        chartRole:
          title: "Role in the chart: \"label\", \"value\", \"value2\", \"timestamp\"\
            , \"category\""
          type: string
        displayLabel:
          title: Display label shown in legend and tooltips
          type: string
        sourceField:
          title: "Field name in the API response objects, e.g. \"eventCount\", \"\
            timestamp\""
          type: string
      title: WidgetFieldMapping maps a field from the API response to a chart role
    WidgetPosition:
      properties:
        x:
          format: int32
          title: "Leftmost column the widget occupies, 0-based"
          type: integer
        "y":
          format: int32
          title: "Topmost row the widget occupies, 0-based"
          type: integer
      title: WidgetPosition defines where a widget sits in the grid
    WidgetSize:
      properties:
        h:
          format: int32
          title: "Row span, one row being roughly 80px tall"
          type: integer
        w:
          description: "Column span. In an 8-column config: 8 = full width, 4 = half,\
            \ 2 = quarter."
          format: int32
          type: integer
      title: WidgetSize defines how many grid cells a widget spans
    WidgetTab:
      properties:
        label:
          title: Tab display label
          type: string
        mode:
          allOf:
          - $ref: "#/components/schemas/WidgetTabMode"
          description: How this tab produces its content. Absent means data.
        params:
          title: Params that override the base data source params when this tab is
            active
          type: object
        view:
          allOf:
          - $ref: "#/components/schemas/WidgetTabView"
          description: |-
            How it is drawn. The map used to be chosen by a tab literally labelled
            "Map", so renaming it to "Carte" lost the map and a data tab called
            "Site Map clicks" was hijacked into one.
      title: WidgetTab represents a tab for grouped views in a widget
    WidgetTabMode:
      default: WIDGET_TAB_MODE_UNSPECIFIED
      description: |-
        WidgetTabMode says how a tab produces what it shows.

         - WIDGET_TAB_MODE_UNSPECIFIED: Fetches the widget's data source with this tab's params, on switch.
         - WIDGET_TAB_MODE_ASSISTANT_SUMMARY: Shows an assistant's analysis of the widget's values. Runs only when the user
        asks, because it costs platform credits, and its result is stored rather
        than regenerated on every view.
      enum:
      - WIDGET_TAB_MODE_UNSPECIFIED
      - WIDGET_TAB_MODE_DATA
      - WIDGET_TAB_MODE_ASSISTANT_SUMMARY
      type: string
    WidgetTabView:
      default: WIDGET_TAB_VIEW_UNSPECIFIED
      description: |-
        WidgetTabView says how a tab draws what it fetched.

         - WIDGET_TAB_VIEW_UNSPECIFIED: The widget's own chart type.
         - WIDGET_TAB_VIEW_MAP: A world map, which needs rows carrying a country code.
      enum:
      - WIDGET_TAB_VIEW_UNSPECIFIED
      - WIDGET_TAB_VIEW_CHART
      - WIDGET_TAB_VIEW_MAP
      type: string
    WidgetVisualization:
      properties:
        chartType:
