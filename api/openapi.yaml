components:
  headers:
    Deprecation:
      description: "Present when the operation is deprecated (RFC 9745): the Unix\
        \ time, prefixed with @, at which it was deprecated. A Link field with rel=\"\
        deprecation\" points to the policy."
      explode: false
      schema:
        example: '@1798761600'
        type: string
      style: simple
    Idempotent-Replayed:
      description: true when this response is the stored answer to an earlier request
        with the same Idempotency-Key.
      explode: false
      schema:
        type: boolean
      style: simple
    RateLimit:
      description: "What is left of the quota: `\"<name>\";r=<remaining requests>;t=<seconds\
        \ until the window resets>` (draft-ietf-httpapi-ratelimit-headers)."
      explode: false
      schema:
        example: '"token";r=598;t=42'
        type: string
      style: simple
    RateLimit-Limit:
      description: Requests allowed in the current window.
      explode: false
      schema:
        example: 600
        type: integer
      style: simple
    RateLimit-Policy:
      description: "The quota that applies to this caller, as a structured field:\
        \ `\"<name>\";q=<requests>;w=<window seconds>` (draft-ietf-httpapi-ratelimit-headers)."
      explode: false
      schema:
        example: '"token";q=600;w=60'
        type: string
      style: simple
    RateLimit-Remaining:
      description: Requests left in the current window.
      explode: false
      schema:
        example: 598
        type: integer
      style: simple
    RateLimit-Reset:
      description: Seconds until the current window resets.
      explode: false
      schema:
        example: 42
        type: integer
      style: simple
    Retry-After:
      description: Seconds to wait before retrying a refused request.
      explode: false
      schema:
        example: 42
        type: integer
      style: simple
    Sunset:
      description: "Present when a deprecated operation has a scheduled end (RFC 8594):\
        \ the HTTP date after which it may stop working."
      explode: false
      schema:
        example: "Thu, 01 Jul 2027 00:00:00 GMT"
        type: string
      style: simple
    X-RateLimit-Limit:
      description: "Same as RateLimit-Limit, for clients that read the X- convention."
      explode: false
      schema:
        example: 600
        type: integer
      style: simple
    X-RateLimit-Remaining:
      description: "Same as RateLimit-Remaining, for clients that read the X- convention."
      explode: false
      schema:
        example: 598
        type: integer
      style: simple
    X-RateLimit-Reset:
      description: "Unix time, in seconds, at which the current window resets."
      explode: false
      schema:
        example: 1791650400
        type: integer
      style: simple
  parameters:
    IdempotencyKey:
      description: "A unique value, such as a UUID, that makes retrying this request\
        \ safe (draft-ietf-httpapi-idempotency-key-header). A retry with the same\
        \ key and the same request returns the first response, with Idempotent-Replayed:\
        \ true, instead of running again. Keys are scoped to the token and kept for\
        \ 24 hours. The same key with a different request is refused with 422; a retry\
        \ while the first request is still running gets 409 with Retry-After."
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        example: 4f7d2c1e-8a8b-4b5e-9f8c-2d3e1a6b7c90
        maxLength: 255
        minLength: 1
      style: simple
  responses:
    "200":
      description: Everything worked as expected.
    "400":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "The request was unacceptable, often due to missing a required\
        \ parameter."
    "401":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: No valid API key provided.
    "402":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The parameters were valid but the request failed.
    "403":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The API key doesn't have permissions to perform the request.
    "404":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The requested resource doesn't exist.
    "409":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: The request conflicts with another request (perhaps due to using
        the same idempotent key).
    "429":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Too many requests hit the API too quickly. We recommend an exponential
        backoff of your requests.
    "500":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Something went wrong on the server end.
    "502":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Something went wrong on the server end.
    "503":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Something went wrong on the server end.
    "504":
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Something went wrong on the server end.
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Too many requests. Wait the number of seconds in Retry-After,\
        \ or until the RateLimit window resets, then retry."
      headers:
        RateLimit:
          $ref: "#/components/headers/RateLimit"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Policy:
          $ref: "#/components/headers/RateLimit-Policy"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-RateLimit-Remaining:
          $ref: "#/components/headers/X-RateLimit-Remaining"
        X-RateLimit-Reset:
          $ref: "#/components/headers/X-RateLimit-Reset"
    default:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unexpected error
  schemas:
    Action:
      default: ACTION_UNSPECIFIED
      description: |-
        - ACTION_UNSPECIFIED: Action not specified
         - ACTION_SCAN: QR code scan
         - ACTION_CLICK: First-time direct link click
      enum:
      - ACTION_UNSPECIFIED
      - ACTION_SCAN
      - ACTION_CLICK
      title: The type of event action
      type: string
    AgentClaim:
      description: What a claim link would hand over.
      example:
        registeredAt: 2000-01-23T04:56:07.000+00:00
        email: email
        expiresAt: 2000-01-23T04:56:07.000+00:00
        postClaimScopes:
        - API_SCOPE_UNSPECIFIED
        - API_SCOPE_UNSPECIFIED
        status: ""
      properties:
        email:
          description: The email the agent named for this claim. The workspace can
            only be claimed with it.
          type: string
        expiresAt:
          format: date-time
          title: When the code stops working
          type: string
        postClaimScopes:
          items:
            $ref: "#/components/schemas/ApiScope"
          title: What the agent may do once the workspace is claimed
          type: array
        registeredAt:
          format: date-time
          title: When the agent registered
          type: string
        status:
          allOf:
          - $ref: "#/components/schemas/AgentClaimStatus"
          title: Where the link stands
      title: AgentClaim
    AgentClaimStatus:
      default: AGENT_CLAIM_STATUS_UNSPECIFIED
      description: |-
        Where a claim link stands.

         - AGENT_CLAIM_STATUS_PENDING: The link is live: enter the code to claim the workspace
         - AGENT_CLAIM_STATUS_CLAIMED: The workspace has been claimed
         - AGENT_CLAIM_STATUS_EXPIRED: The link or the registration expired, or the agent started a newer claim
      enum:
      - AGENT_CLAIM_STATUS_UNSPECIFIED
      - AGENT_CLAIM_STATUS_PENDING
      - AGENT_CLAIM_STATUS_CLAIMED
      - AGENT_CLAIM_STATUS_EXPIRED
      title: AgentClaimStatus
      type: string
    AnalyticsDashboard:
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        linkId: linkId
        chatMessages:
        - sender: sender
          id: id
          text: text
          timestamp: 2000-01-23T04:56:07.000+00:00
        - sender: sender
          id: id
          text: text
          timestamp: 2000-01-23T04:56:07.000+00:00
        name: name
        id: id
        config:
          gridColumns: 0
          widgets:
          - visualization: ""
            size: ""
            id: id
            position: ""
            title: title
            dataSource: ""
          - visualization: ""
            size: ""
            id: id
            position: ""
            title: title
            dataSource: ""
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        chatMessages:
          items:
            $ref: "#/components/schemas/ChatDisplayMessage"
          title: User-visible chat messages for rendering in the chat panel
          type: array
        config:
          $ref: "#/components/schemas/DashboardConfig"
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        linkId:
          description: Link this dashboard is scoped to. Empty for the workspace-wide
            dashboard.
          type: string
        name:
          type: string
        updatedAt:
          format: date-time
          type: string
      title: AnalyticsDashboard represents a workspace's analytics dashboard
    AnalyticsDashboardServiceGenerateWidgetSummaryBody:
      example:
        force: true
      properties:
        force:
          title: Regenerate even when the stored result is still current
          type: boolean
    AnalyticsDashboardServiceUpdateDashboardBody:
      example:
        name: name
        config:
          gridColumns: 0
          widgets:
          - visualization: ""
            size: ""
            id: id
            position: ""
            title: title
            dataSource: ""
          - visualization: ""
            size: ""
            id: id
            position: ""
            title: title
            dataSource: ""
      properties:
        config:
          $ref: "#/components/schemas/DashboardConfig"
        name:
          type: string
    AnalyticsWidgetResult:
      description: AnalyticsWidgetResult is a generated result for an on-demand widget
        tab.
      example:
        sourceCount: 6
        stale: true
        widgetId: widgetId
        currentCount: 0
        generatedAt: 2000-01-23T04:56:07.000+00:00
        text: text
      properties:
        currentCount:
          format: int32
          title: "How many values exist now, for \"N new answers since this ran\""
          type: integer
        generatedAt:
          format: date-time
          title: When it was produced
          type: string
        sourceCount:
          format: int32
          title: How many values it was generated from
          type: integer
        stale:
          description: |-
            True when the underlying values have changed since it was generated, so
            the UI can offer a re-run rather than presenting stale prose as current.
          type: boolean
        text:
          title: The generated analysis
          type: string
        widgetId:
          type: string
    ApiScope:
      default: API_SCOPE_UNSPECIFIED
      description: |-
        ApiScope is one permission an API token or OAuth grant can hold.

        A write scope also grants the read scope of the same resource.

         - API_SCOPE_UNSPECIFIED: Not a scope. Rejected wherever a scope is expected.
         - API_SCOPE_LINKS_READ: Read links, their QR code images, tags, folders and link settings.
         - API_SCOPE_LINKS_WRITE: Create, update and delete links, tags, folders and link settings.
         - API_SCOPE_WORKFLOWS_READ: Read the workflow steps behind a link and validate them.
         - API_SCOPE_WORKFLOWS_WRITE: Create, connect, update, lay out and delete workflow steps.
         - API_SCOPE_QRCODES_READ: Read QR code designs and QR code templates.
         - API_SCOPE_QRCODES_WRITE: Change QR code designs and create, publish and delete QR code templates.
