        style: simple
      - description: The ID of the step the connection leaves from (UUID)
        explode: false
        in: path
        name: stepId
        required: true
        schema:
          type: string
        style: simple
      - description: |-
          Which exit of that step to connect. "next" for atomic steps, or a button
          id, option id, range id, country code, or "else" for composite steps.
        explode: false
        in: path
        name: branchId
        required: true
        schema:
          type: string
        style: simple
