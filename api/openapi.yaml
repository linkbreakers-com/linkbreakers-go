    CreateDashboardRequest:
      example:
        linkId: linkId
        name: name
        id: id
        useDefaultWidgets: true
        config: ""
      properties:
        config:
          allOf:
          - $ref: "#/components/schemas/DashboardConfig"
          description: |-
            Initial widgets. Empty means the dashboard starts with none, because its
            contents are normally agreed with the assistant before anything is created.
        id:
          description: Client-supplied dashboard id. Generated server-side when empty.
          type: string
        linkId:
          description: Link to scope this dashboard to. Empty creates the workspace-wide
            dashboard.
          type: string
        name:
          description: Display name. Defaults to "Default Dashboard" when empty.
          type: string
        useDefaultWidgets:
          description: |-
            Fill the dashboard with a starter set instead of leaving it empty, for a
            dashboard made in one step rather than agreed in a conversation. Without
            link_id it is the workspace set (scans over time, top links, geography,
            technology and more). With link_id it is the link set: scans over time,
            geography, technology, peak hours, and new versus returning visitors, which
            is everything any link records. The service applies it to any link; whether
            it suits one is the caller's judgement, since a workflow that collects
            answers deserves widgets for them. Ignored when config is set, and hidden
            from the assistant, which agrees its widgets with the user and would
