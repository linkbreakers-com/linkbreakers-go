    SlackIntegration:
      description: |-
        Represents a connected Slack workspace integration that receives event notifications
        in a configured channel when workflow steps complete.
      properties:
        createdAt:
          format: date-time
          readOnly: true
          title: The timestamp when the integration was connected
          type: string
        createdBy:
          title: The member who connected the integration (UUID)
          type: string
        failureCount:
          format: int64
          readOnly: true
          title: Count of failed notification deliveries
          type: string
        id:
          example: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
          title: The unique identifier of the Slack integration (UUID)
          type: string
        lastSentAt:
          format: date-time
          readOnly: true
          title: The timestamp when a notification was last sent
          type: string
        linkId:
          description: |-
            Filter notifications by a specific link ID.
            Only events from this link will trigger notifications.
            If empty, all links in the workspace will trigger notifications.
          example: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
          type: string
        slackChannelId:
          example: C01ABC123
          title: The Slack channel ID where notifications are sent
          type: string
        slackChannelName:
          example: general
          title: The Slack channel name where notifications are sent
          type: string
        slackTeamId:
          example: T01ABC123
          title: The Slack team/workspace ID
          type: string
        slackTeamName:
          example: My Company
          title: The Slack team/workspace name
          type: string
        status:
          allOf:
          - $ref: "#/components/schemas/SlackIntegrationStatus"
          title: Current status of the integration
        successCount:
          format: int64
          readOnly: true
          title: Count of successful notification deliveries
          type: string
        triggers:
          description: |-
            Filter notifications by workflow step kinds.
            Only workflow steps matching these kinds will trigger notifications.
            If empty, all workflow step kinds will trigger notifications.
          items:
            description: |-
              - KIND_UNSPECIFIED: Workflow step kind not specified
               - KIND_ENTRY: Entry steps are automatically triggered when a visitor reaches the workflow
               - KIND_EXIT: Exit steps finalize the workflow (commonly a redirect)
               - KIND_INTERACTION: Interaction steps require visitor input (forms, passwords, etc.)
               - KIND_CONDITION: Condition steps evaluate logic and route to different next steps
            enum:
            - KIND_UNSPECIFIED
            - KIND_ENTRY
            - KIND_EXIT
            - KIND_INTERACTION
            - KIND_CONDITION
            type: string
          type: array
        updatedAt:
          format: date-time
          readOnly: true
          title: The timestamp when the integration was last updated
          type: string
        workspaceId:
          example: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
          title: The workspace ID this integration belongs to (UUID)
          type: string
      title: SlackIntegration
    SlackIntegrationStatus:
      default: SLACK_INTEGRATION_STATUS_UNSPECIFIED
      description: |-
        - SLACK_INTEGRATION_STATUS_UNSPECIFIED: Status not specified
         - SLACK_INTEGRATION_STATUS_ACTIVE: Integration is active and sending notifications
         - SLACK_INTEGRATION_STATUS_PAUSED: Integration is paused by user action
         - SLACK_INTEGRATION_STATUS_DISCONNECTED: Integration is disconnected
      enum:
