      - SLACK_INTEGRATION_STATUS_ACTIVE
      - SLACK_INTEGRATION_STATUS_PAUSED
      - SLACK_INTEGRATION_STATUS_DISCONNECTED
      title: The status of a Slack integration
      type: string
