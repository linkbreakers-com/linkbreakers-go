      example:
        linkId: linkId
        endpointUrl: endpointUrl
        name: name
        source: ""
        triggers:
        - KIND_UNSPECIFIED
        - KIND_UNSPECIFIED
      properties:
        endpointUrl:
          title: The URL endpoint that will receive webhook POST requests
          type: string
        linkId:
          description: |-
            Filter webhook notifications by a specific link ID.
            Only events from this link will trigger webhook notifications.
            If empty, all links in the workspace will trigger notifications.
          type: string
        name:
          title: The name of the webhook
          type: string
        source:
          allOf:
          - $ref: "#/components/schemas/WebhookSource"
          title: "Source of the webhook - indicates creation method (optional, defaults\
            \ to LINKBREAKERS for manual dashboard creation)"
        triggers:
          description: |-
            Filter webhook notifications by workflow step kinds.
            Only workflow steps matching these kinds will trigger webhook notifications.
            If empty, all workflow step kinds will trigger notifications.
          items:
            description: |-
              - KIND_UNSPECIFIED: Workflow step kind not specified
               - KIND_ENTRY: Entry steps are automatically triggered when a visitor reaches the workflow
               - KIND_EXIT: Exit steps finalize the workflow (commonly a redirect)
               - KIND_INTERACTION: Interaction steps require visitor input (forms, passwords, etc.)
               - KIND_CONDITION: Condition steps evaluate logic and route to different next steps
            enum:
            - KIND_UNSPECIFIED
            - KIND_ENTRY
            - KIND_EXIT
            - KIND_INTERACTION
            - KIND_CONDITION
            type: string
          type: array
      required:
      - endpointUrl
      - name
      title: CreateWebhookRequest represents the request to create a new webhook
