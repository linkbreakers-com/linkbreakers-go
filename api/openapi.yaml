          id: d22f7bf1-83a9-4f3a-9b37-9a3a21b6ac11
          scopes:
          - API_SCOPE_UNSPECIFIED
          - API_SCOPE_UNSPECIFIED
          keyType: WORKSPACE_TOKEN_KEY_TYPE_UNSPECIFIED
          updatedAt: 2000-01-23T04:56:07.000+00:00
          workspaceId: c0d3cafe-5b1e-4d42-a6fd-0c5f5c3962d0
        totalCount: totalCount
      properties:
        nextPageToken:
          description: Cursor to continue listing tokens. Empty on the last page.
          type: string
        tokens:
          items:
            $ref: "#/components/schemas/WorkspaceToken"
          title: Tokens scoped to the calling workspace
          type: array
        totalCount:
          description: |-
            How many records exist in total, so a client can tell a complete answer
            from a page of one. A local-first client reads absence from this list as
