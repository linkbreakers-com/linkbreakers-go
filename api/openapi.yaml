    FunnelBranch:
      description: |-
        FunnelBranch is one choice within a step, such as a button on a multi-link
        page.
      example:
        visits: visits
        label: label
        shareOfStep: 6.027456183070403
      properties:
        label:
          title: "The button's label, as the visitor saw it"
          type: string
        shareOfStep:
          format: double
          title: Visits as a percentage of the journeys that reached the step
          type: number
        visits:
          description: |-
            Journeys that took this branch. Zero means it was offered and nobody took
            it, which is worth seeing rather than hiding.
          format: int64
          type: string
    FunnelStep:
      description: "FunnelStep is one step of the journey, already placed in order."
      example:
        occurrences: occurrences
        stepKind: stepKind
        visits: visits
        stepAction: stepAction
        identifiedVisitors: identifiedVisitors
        interactionRate: 5.962133916683182
        dropOffFromPrevious: dropOffFromPrevious
        branches:
        - visits: visits
          label: label
          shareOfStep: 6.027456183070403
        - visits: visits
          label: label
          shareOfStep: 6.027456183070403
        conversionRate: 1.4658129805029452
        interactions: interactions
      properties:
        branches:
          description: |-
            Choices offered inside this step, where it offers one. A multi-link step is
            a single row but several different things happened in it.
          items:
            $ref: "#/components/schemas/FunnelBranch"
          type: array
        conversionRate:
          format: double
          title: Visits as a percentage of those who arrived; the entry step is 100
          type: number
        dropOffFromPrevious:
          format: int64
          title: Journeys that did not get here from the step above
          type: string
        identifiedVisitors:
          format: int64
          title: How many of those journeys belong to a known visitor
          type: string
        interactionRate:
          description: |-
            Interactions as a percentage of occurrences.

            The action is recorded on the trace the step already opened, so both counts
            come from the same rows and this cannot exceed 100, however many times one
            visitor pressed. Branch shares can add up past 100, which is a different
            and honest number: a social links page is not a fork, and one visitor may
            open every link on it.
          format: double
          type: number
        interactions:
          description: |-
            Journeys where the visitor acted on the step rather than only reaching it:
            pressing a link on a social links page, choosing a button on a multi-link.
            Zero on steps that offer nothing to act on.
          format: int64
          type: string
        occurrences:
          format: int64
          title: "Every trace recorded, so a step that repeats stays visible"
          type: string
        stepAction:
          title: "Workflow step, e.g. \"LINK_VISIT\", \"FORM_SUBMIT\", \"CLIENT_REDIRECT\""
          type: string
        stepKind:
          title: "\"ENTRY\", \"CONDITION\", \"INTERACTION\" or \"EXIT\""
          type: string
        visits:
          description: |-
            Journeys that reached this step, counted per event. Events are used rather
            than visitors because visitor_id is NULL on most traces in practice, and
            counting visitors makes later steps look wider than the arrival they came
            from, which pushes conversion rates above 100%.
          format: int64
          type: string
